<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Noetic Atlas v0.4.1.2 — Energetic Analysis Observatory</title>
<style>
:root{--bg:#080c10;--p:#10171e;--p2:#0b1117;--line:#293541;--text:#edf2f5;--muted:#91a0ad;--gold:#d8be73;--violet:#ac96d0;--cyan:#70b8ba;--green:#83c39b}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:13px/1.58 system-ui,-apple-system,Segoe UI,sans-serif}#core{position:fixed;inset:0 620px 0 0;width:calc(100% - 620px);height:100%;border:0}#dock{position:fixed;right:0;top:0;width:620px;height:100%;overflow:auto;background:var(--p);border-left:1px solid var(--line)}header{position:sticky;top:0;background:#10171efa;border-bottom:1px solid var(--line);padding:14px;z-index:4}h1{font-size:17px;margin:0}.eyebrow{font:9px ui-monospace,monospace;color:var(--gold);letter-spacing:.08em}.tabs,.filters,.nodes,.condBtns{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}button{background:var(--p2);color:#c5cfd7;border:1px solid var(--line);border-radius:6px;padding:6px 8px;cursor:pointer}button.active{background:var(--gold);color:#111;border-color:var(--gold)}.pane{display:none;padding:14px}.pane.active{display:block}.call,.card{background:var(--p2);border:1px solid var(--line);border-radius:9px}.call{padding:10px;border-left:3px solid var(--gold);font-size:10.5px}.card{margin:11px 0;overflow:hidden}.head{padding:10px;border-bottom:1px solid var(--line)}.head h2{font-size:14px;margin:4px 0}.tag{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:1px 6px;font-size:8px;color:var(--muted);margin-right:4px}.tag.energy{border-color:var(--gold);color:var(--gold)}.tag.interp{border-color:var(--cyan);color:var(--cyan)}.body{padding:10px}.section{border-top:1px solid #24303a;padding:8px 0}.section:first-child{border-top:0}.section h3{font-size:9px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 4px}.section p{font-size:10.5px;margin:0}.life,.soul{padding:9px;margin:8px 0;background:#111820;font-size:10.5px}.life{border-left:3px solid var(--gold)}.soul{border-left:3px solid var(--violet)}.practice{font-size:10px;margin:5px 0 0 19px;padding:0}.proof{font:9px/1.45 ui-monospace,monospace;white-space:pre-wrap;word-break:break-word;background:#080d12;border:1px solid #222c36;border-radius:6px;padding:7px}.fact{display:grid;grid-template-columns:135px 1fr;gap:8px;padding:6px 0;border-bottom:1px solid #222d37;font-size:10px}.k{color:var(--muted)}.present{color:var(--gold)}.in_sect{color:var(--green)}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}.summary div{background:var(--p2);border:1px solid var(--line);border-radius:8px;padding:8px}.summary b{display:block;color:var(--gold);font-size:16px}.summary span{font-size:9px;color:var(--muted)}.node{font-size:9px;padding:3px 6px}.toggle{position:fixed;right:624px;top:8px;z-index:20}.closed #dock{display:none}.closed #core{width:100%;right:0}.closed .toggle{right:8px}@media(max-width:1000px){#core{width:100%;right:0}#dock{width:min(98vw,620px)}.toggle{right:min(calc(98vw + 4px),624px)}}
</style></head><body>
<button class="toggle" id="toggle">Analysis ▸</button><iframe id="core" src="./index.html?build=v0412b-energetic" title="Noetic Atlas core"></iframe>
<aside id="dock"><header><h1>Noetic Atlas <span style="color:var(--gold)">v0.4.1.2</span></h1><div class="eyebrow">DEEP ENERGETIC SYNTHESIS · HOUSES + RULERS + GRAPH THEORY</div><div class="tabs"><button class="active" data-pane="analysis">Energetic Analysis</button><button data-pane="findings">Graph Findings</button><button data-pane="metrics">Metrics</button><button data-pane="condition">Condition</button><button data-pane="integrity">Integrity</button></div></header><section id="analysis" class="pane active"></section><section id="findings" class="pane"></section><section id="metrics" class="pane"></section><section id="condition" class="pane"></section><section id="integrity" class="pane"></section></aside>
<script type="module">
import {computePrimitiveConditions,CLASSICAL_PLANETS} from '../src/conditions/primitive-condition-engine.mjs';import {analyzeGraphArchitecture} from '../src/research/graph-analytics-engine.mjs';import {buildEnergeticSynthesis} from '../src/interpretation/energetic-synthesis-display.mjs';
const core=document.getElementById('core'),toggle=document.getElementById('toggle');let analysis=null,conditions=null,graph=null,energy=null,filter='featured',chosen='Sun',selected=null,observer=null;const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const pretty=x=>JSON.stringify(x,null,2);const cls=x=>['present','in_sect','out_of_sect'].includes(x)?x:'';
toggle.onclick=()=>{document.body.classList.toggle('closed');toggle.textContent=document.body.classList.contains('closed')?'Analysis ◂':'Analysis ▸'};document.querySelectorAll('[data-pane]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-pane]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.pane').forEach(x=>x.classList.toggle('active',x.id===b.dataset.pane));if(b.dataset.pane==='integrity')renderIntegrity()});
function brand(){try{const d=core.contentDocument;d.title='Noetic Atlas v0.4.1.2 — Energetic Analysis Observatory';const x=d.querySelector('.brand h1 small');if(x)x.textContent='v0.4.1.2 · ENERGETIC ANALYSIS'}catch{}}
function nodes(xs=[]){return xs.length?`<div class="nodes">${xs.map(x=>`<button class="node" data-node="${esc(x)}">${esc(x)}</button>`).join('')}</div>`:''}function wire(root){root.querySelectorAll('[data-node]').forEach(b=>b.onclick=()=>{try{const d=core.contentDocument,f=d.querySelector('.tabs button[data-view="field"]');if(f)f.click();const g=[...d.querySelectorAll('#fieldSvg g')].find(el=>[...el.querySelectorAll('text')].some(t=>t.textContent.trim()===b.dataset.node));if(g)g.dispatchEvent(new MouseEvent('click',{bubbles:true,view:core.contentWindow}))}catch{}});root.querySelectorAll('[data-proof]').forEach(b=>b.onclick=()=>{selected=current()[Number(b.dataset.proof)];document.querySelector('[data-pane="integrity"]').click()})}
function current(){if(!energy)return[];if(filter==='graph')return energy.graph_cards;if(filter==='ceres')return energy.ceres;if(filter==='outer')return energy.outer_planets;if(filter==='placements')return energy.placements;if(filter==='aspects')return energy.aspects;return energy.featured}
function sync(){brand();try{const raw=core.contentDocument?.getElementById('json')?.textContent?.trim();if(!raw?.startsWith('{'))return;analysis=JSON.parse(raw);conditions=computePrimitiveConditions(analysis);graph=analyzeGraphArchitecture(analysis,conditions);energy=buildEnergeticSynthesis(analysis,graph,conditions);render()}catch(e){console.warn(e)}}
function section(name,text){return text?`<div class="section"><h3>${esc(name)}</h3><p>${esc(text)}</p></div>`:''}function card(a,i){const s=a.sections||{};return`<article class="card"><div class="head"><span class="tag interp">interpretive-inference</span><span class="tag energy">symbolic energy</span><h2>${esc(a.title)}</h2>${nodes(a.objects||[])}</div><div class="body">${section('Core energy',s.core_energy||s.plain_language)}${section('How the energy moves',s.energetic_synthesis)}${section('House ruler + dispositor routing',s.rulership_and_routing)}${section('Aspect modulation',s.aspect_modulation)}${section('Graph context',s.graph_context)}${section('Balanced expression',s.balanced_expression)}${section('Under-expression / depletion',s.under_expression)}${section('Over-expression / excess',s.over_expression)}${s.material_expression?`<div class="life"><b>Material / lived expression</b><br>${esc(s.material_expression)}</div>`:''}${s.soul_question?`<div class="soul"><b>Soul / spirit inquiry</b><br>${esc(s.soul_question)}</div>`:''}${s.embodiment_practices?.length?`<div class="section"><h3>Ways to work with it</h3><ol class="practice">${s.embodiment_practices.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div>`:''}<details><summary>Evidence used</summary><div class="proof">${esc(pretty(a.evidence))}</div></details><button data-proof="${i}">Why this analysis?</button></div></article>`}
function renderAnalysis(){const box=document.getElementById('analysis');if(!energy){box.innerHTML='<div class="call">Calculate or load a chart to generate the energetic synthesis.</div>';return}const list=current();box.innerHTML=`<div class="call"><b>This is the reading layer.</b><br>The system now interprets the chart as archetypal current → sign frequency → actual Whole Sign house → modern natural-house resonance → ruler/dispositor handoff → aspect geometry → graph structure → balanced/depleted/excess expressions → lived materialization → soul-level inquiry. Natural-house correspondence is a labeled modern overlay, not a replacement for the actual house sign. “Energy” is symbolic field language, not a measured physical force.</div><div class="summary"><div><b>${energy.placements.length}</b><span>placement profiles</span></div><div><b>${energy.graph_cards.length}</b><span>graph structures translated</span></div><div><b>${energy.aspects.length}</b><span>tight aspect currents</span></div></div><div class="filters">${[['featured','Featured synthesis'],['graph','Graph → meaning'],['ceres','Ceres'],['outer','Outer planets'],['placements','All placements'],['aspects','Tight aspects']].map(([k,l])=>`<button data-filter="${k}" class="${filter===k?'active':''}">${l}</button>`).join('')}</div>${filter==='ceres'&&!energy.ceres.length?`<div class="call"><b>Ceres is not being ignored.</b><br>${esc(energy.applicability.ceres)} The interpretation model is ready for Ceres as soon as a coordinate exists in the chart state.</div>`:''}${list.map(card).join('')||'<div class="call">No objects in this category for the current state.</div>'}`;box.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;renderAnalysis()});wire(box)}
function translate(f){if(!energy)return null;if(/basin|terminal/i.test(f.id||f.title||''))return energy.graph_cards.find(x=>x.id==='energy.graph.terminal_basin');if(/bottleneck|upstream/i.test(f.id||f.title||''))return energy.graph_cards.find(x=>x.id.startsWith('energy.graph.bottleneck.'));return null}
function renderFindings(){const box=document.getElementById('findings');if(!graph){box.innerHTML='<div class="call">No graph state yet.</div>';return}box.innerHTML=`<div class="call"><b>The graph term is never the interpretation.</b><br>Technical facts remain auditable; readable energetic meaning is shown first when a translation exists.</div>${graph.findings.map((f,i)=>{const t=translate(f);return`<article class="card"><div class="head"><h2>${esc(f.title)}</h2>${nodes(f.scope?.nodes||[])}</div><div class="body">${t?`<div class="life"><b>Meaning in this chart</b><br>${esc(t.sections.plain_language)}<br><br>${esc(t.sections.energetic_synthesis)}<br><br>${esc(t.sections.material_expression)}</div>`:''}<details><summary>Technical graph result</summary>${section('Graph statement',f.statement)}<div class="proof">${esc(pretty(f.measurement))}</div></details></div></article>`}).join('')}`;wire(box)}
function renderMetrics(){const box=document.getElementById('metrics');if(!graph){box.innerHTML='<div class="call">No metrics yet.</div>';return}box.innerHTML=`<div class="call"><b>Metrics are evidence, not the reading.</b><br>The mathematical layer stays available for audit while the main Analysis tab explains what the structure means in houses, planetary functions, and lived patterns.</div>${graph.metrics.map(m=>`<article class="card"><div class="head"><h2>${esc(m.label)}</h2><b style="color:var(--gold);font-size:18px">${esc(m.value)}</b> ${esc(m.unit||'')}</div><div class="body">${section('What was measured',m.definition)}${section('Observed in this chart',m.readable_analysis.observation)}<details><summary>Formula + proof</summary><div class="proof">${esc(m.formula)}\n${esc(pretty(m.integrity))}</div></details></div></article>`).join('')}`}
function statusLine(f,label){const s=f?.status||'—';return`<div class="fact"><span class="k">${label}</span><span class="${cls(s)}">${esc(s)}</span></div>`}function renderCondition(){const box=document.getElementById('condition');if(!conditions){box.innerHTML='<div class="call">No classical condition yet.</div>';return}const r=conditions.by_planet[chosen]||conditions.by_planet.Sun,e=r.essential,s=r.sect,p=r.positional.angularity;box.innerHTML=`<div class="call">Condition remains a separate traditional layer beneath the energetic synthesis.</div><div class="condBtns">${CLASSICAL_PLANETS.map(x=>`<button data-cp="${x}" class="${x===r.planet?'active':''}">${x}</button>`).join('')}</div><h2>${esc(r.planet)} · ${esc(r.identity.sign)} · ${r.identity.computed_house}H</h2>${statusLine(e.domicile,'Domicile')}${statusLine(e.adversity,'Adversity')}${statusLine(e.exaltation,'Exaltation')}${statusLine(e.depression,'Depression / fall')}<div class="fact"><span class="k">Bound ruler</span><span>${esc(e.bound.bound_ruler)}</span></div><div class="fact"><span class="k">Sect</span><span>${esc(s.condition.status)}</span></div><div class="fact"><span class="k">Angularity</span><span>${esc(p.class)}</span></div>`;box.querySelectorAll('[data-cp]').forEach(b=>b.onclick=()=>{chosen=b.dataset.cp;renderCondition()})}
function renderIntegrity(){const box=document.getElementById('integrity');box.innerHTML=`<div class="call"><b>Integrity stack</b><br>Coordinates → sign/house → rule layer → graph derivation → energetic interpretation. The modern natural-house overlay and Ceres profile remain explicitly identified in the interpretation state.</div><div class="proof">${esc(pretty(selected||energy?.integrity||graph?.integrity||{}))}</div><details><summary>Full energetic state</summary><div class="proof">${esc(pretty(energy))}</div></details>`}function render(){renderAnalysis();renderFindings();renderMetrics();renderCondition();renderIntegrity()}
core.addEventListener('load',()=>{brand();try{const d=core.contentDocument,j=d.getElementById('json'),ins=d.getElementById('inspector'),status=d.getElementById('status');observer?.disconnect();observer=new MutationObserver(sync);if(j)observer.observe(j,{childList:true,characterData:true,subtree:true});if(ins)observer.observe(ins,{childList:true,characterData:true,subtree:true});if(status)observer.observe(status,{childList:true,characterData:true,subtree:true});sync()}catch(e){console.warn(e)}});
</script></body></html>
