<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Noetic Atlas v0.4.5 — Research Regimes</title><style>
:root{--bg:#080c10;--p:#10171e;--p2:#0b1117;--line:#293541;--text:#edf2f5;--muted:#91a0ad;--gold:#d8be73;--cyan:#70b8ba;--violet:#ac96d0;--green:#83c39b}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:13px/1.5 system-ui}header{height:74px;padding:8px 12px;border-bottom:1px solid var(--line);background:#0c1218;display:flex;align-items:center;gap:14px}h1{font-size:18px;margin:0}.build{font-size:9px;color:var(--gold)}.sub{font:9px ui-monospace;color:var(--muted)}nav,.aperture{display:flex;gap:5px;overflow-x:auto}nav{flex:1}button{background:var(--p2);color:#cbd3d9;border:1px solid var(--line);border-radius:6px;padding:7px 9px;white-space:nowrap;cursor:pointer}button.active{background:var(--gold);color:#111;border-color:var(--gold)}.aperture button.active{background:var(--cyan);border-color:var(--cyan)}#workspace{height:calc(100% - 74px)}.view{display:none;width:100%;height:100%}.view.active{display:block}#core{border:0;width:100%;height:100%}.scroll{height:100%;overflow:auto;padding:14px;max-width:1500px;margin:auto}.panel,.call,.card{background:var(--p);border:1px solid var(--line);border-radius:9px;padding:11px;margin-bottom:10px}.call{border-left:3px solid var(--gold)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.tag{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:1px 6px;font-size:9px;margin:2px}.tag.op{color:var(--green);border-color:var(--green)}.tag.exp{color:var(--violet);border-color:var(--violet)}.tag.disc{color:var(--cyan);border-color:var(--cyan)}.muted{color:var(--muted);font-size:10px}code{font-size:10px;color:var(--gold)}table{width:100%;border-collapse:collapse;font-size:10px}th,td{border:1px solid #26313b;padding:6px;text-align:left}th{background:var(--p2);color:var(--muted)}.researchOnly{display:none}body[data-aperture="research"] .researchOnly{display:block}@media(max-width:900px){header{height:126px;display:block}.aperture,nav{margin-top:5px}#workspace{height:calc(100% - 126px)}.grid{grid-template-columns:1fr}}
</style></head><body data-aperture="personal"><header><div><h1>Noetic Atlas <span class="build">v0.4.5 candidate</span></h1><div class="sub">ONE CHART STATE · THREE RESEARCH REGIMES · NO EXPERIMENTAL CONTAMINATION</div></div><nav><button class="active" data-view="chart">Chart</button><button data-view="reading">Reading</button><button data-view="resonance">Resonance</button><button data-view="network">Network</button><button data-view="houseflow">House Flow</button><button data-view="condition">Condition</button><button data-view="proof">Proof</button></nav><div class="aperture"><button class="active" data-aperture="personal">Personal</button><button data-aperture="research">Research</button></div></header><div id="workspace"><section id="chart" class="view active"><iframe id="core" src="./index.html?build=v045-core" title="Noetic Atlas deterministic chart core"></iframe></section><section id="reading" class="view"><div class="scroll" id="readingContent"></div></section><section id="resonance" class="view"><div class="scroll" id="resonanceContent"></div></section><section id="network" class="view"><div class="scroll" id="networkContent"></div></section><section id="houseflow" class="view"><div class="scroll" id="riverContent"></div></section><section id="condition" class="view"><div class="scroll" id="conditionContent"></div></section><section id="proof" class="view"><div class="scroll" id="proofContent"></div></section></div>
<script type="module">
import {computeConditionSystem} from '../src/conditions/condition-system.mjs';
import {analyzeGraphArchitecture} from '../src/research/graph-analytics-engine.mjs';
import {buildHouseResonanceMap} from '../src/interpretation/house-resonance-engine.mjs';
import {buildModernRulershipOverlay} from '../src/interpretation/modern-rulership-overlay.mjs';
import {buildHouseRiver} from '../src/research/house-river-engine.mjs';
import {computeExtendedAspects} from '../src/research/aspect-family-engine.mjs';
import {buildV044DiscoverySuite} from '../src/research/v044-discovery-suite.mjs';
import {buildResearchLab} from '../src/research/research-lab-engine.mjs';
const core=document.getElementById('core'),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let state=null,last='';
function view(id){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===id));document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===id));}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>view(b.dataset.view));document.querySelectorAll('[data-aperture]').forEach(b=>b.onclick=()=>{document.body.dataset.aperture=b.dataset.aperture;document.querySelectorAll('[data-aperture]').forEach(x=>x.classList.toggle('active',x===b));render();});
function jsonNode(){try{return core.contentDocument?.getElementById('json')}catch{return null}}function sample(){try{const d=core.contentDocument;if(!d?.getElementById('json')?.textContent?.trim()?.startsWith('{'))d?.getElementById('sample')?.click()}catch{}}
function sync(){try{const raw=jsonNode()?.textContent?.trim();if(!raw?.startsWith('{')||raw===last)return;last=raw;const analysis=JSON.parse(raw),conditions=computeConditionSystem(analysis),graph=analyzeGraphArchitecture(analysis,conditions.primitive),resonance=buildHouseResonanceMap(analysis),modern=buildModernRulershipOverlay(analysis),river=buildHouseRiver(analysis),extended=computeExtendedAspects(analysis),discoveries=buildV044DiscoverySuite({analysis,conditions,graph,resonance,river,modern,extended}),lab=buildResearchLab({analysis,graph,river,conditions,modern,extended,discoveries});state={analysis,conditions,graph,resonance,modern,river,extended,discoveries,lab};render()}catch(e){document.getElementById('networkContent').innerHTML=`<div class="call">Initialization failed: ${esc(e.message)}</div>`}}
function attach(){sample();let n=0;const t=setInterval(()=>{n++;sample();const j=jsonNode();if(j){new MutationObserver(sync).observe(j,{childList:true,subtree:true,characterData:true});sync();clearInterval(t)}if(n>50)clearInterval(t)},160)}core.addEventListener('load',attach);attach();
const badge=r=>`<span class="tag ${r==='operational'?'op':r==='experimental'?'exp':'disc'}">${esc(r)}</span>`;
function render(){if(!state)return;const {analysis,conditions,graph,resonance,modern,river,extended,discoveries,lab}=state,research=document.body.dataset.aperture==='research';
 document.getElementById('readingContent').innerHTML=`<div class="call"><b>Personal Reading uses the Operational model.</b><br>Experimental and discovery objects remain outside the consumer fact set unless Research aperture is explicitly active.</div><div class="panel">${badge('operational')} <b>Chart authority</b><p>${analysis.objects.length} objects · ${analysis.aspects.length} computed relationships · ${graph.graphs.classical_dispositor.terminal_basins.length} classical terminal basin(s).</p></div><div class="researchOnly panel">${badge('experimental')} <b>Research context available, not merged into the Reading.</b><p>${lab.hypotheses.length} registered hypothesis packs; ${lab.discovery.count} discovery candidates. A future generator may discuss them only with their hypothesis/model identities attached.</p></div>`;
 const h=resonance.houses[0];document.getElementById('resonanceContent').innerHTML=`<div class="call">${badge('operational')} Actual Whole-Sign field and traditional ruler remain primary.</div><div class="panel"><b>1H ${esc(h.actual.sign)}</b><p>Traditional ruler: ${esc(h.actual.ruler)}. Phase rotation: ${resonance.rotation.degrees}°.</p></div><div class="researchOnly panel">${badge('experimental')} <b>Parallel rulership overlays</b><p>${modern.houses.filter(x=>x.modern_outer_ruler).length} houses currently receive an explicitly secondary modern outer-rulership comparison. These annotations do not rewrite the traditional dispositor graph.</p></div>`;
 const cmp=lab.comparisons.filter(x=>x.changed_fields);document.getElementById('networkContent').innerHTML=`<div class="call">${badge('operational')} Canonical aspect + traditional dispositor network.</div><div class="grid"><div class="card"><b>${graph.graphs.classical_dispositor.terminal_basins.length}</b><div class="muted">classical terminal basins</div></div><div class="card"><b>${analysis.aspects.length}</b><div class="muted">computed canonical relationships</div></div><div class="card"><b>${river.planetary_bands.length}</b><div class="muted">House River planetary bands</div></div></div><div class="researchOnly panel"><h2>Experimental model comparisons</h2>${cmp.map(c=>`<div class="card">${badge('experimental')} <b>${esc(c.hypothesis_id)}</b><p>${c.changed_fields.length?`Changed fields: ${c.changed_fields.map(esc).join(', ')}`:'No structural delta detected.'}</p><div class="muted">A delta is not evidence that the experimental model is superior.</div></div>`).join('')}<h2>Discovery candidates</h2>${lab.discovery.candidates.slice(0,20).map(c=>`<div class="card">${badge('discovery')} <b>${esc(c.candidate_id)}</b><p>${esc(c.description)}</p><div class="muted">${esc(c.promotion_state)} · null comparison ${esc(c.model_identity.status.null_comparison)}</div></div>`).join('')}</div>`;
 document.getElementById('riverContent').innerHTML=`<div class="call">${badge('operational')} House Flow remains a lived-domain projection of the traditional ruler graph.</div><div class="panel"><table><tr><th>House</th><th>Entry ruler</th><th>Route</th></tr>${river.houses.map(x=>`<tr><td>${x.house}H</td><td>${esc(x.entry_ruler)}</td><td>${esc((x.path||x.route||[]).join(' → '))}</td></tr>`).join('')}</table></div><div class="researchOnly panel">${badge('experimental')} Experimental routing hypotheses may eventually produce alternate House River snapshots, but no registered-not-executed hypothesis is allowed to fabricate one.</div>`;
 document.getElementById('conditionContent').innerHTML=`<div class="call">${badge('operational')} Primitive, relational, and compound condition remain Operational unless a named model says otherwise.</div><div class="grid"><div class="card"><b>${Object.keys(conditions.primitive.by_planet||{}).length}</b><div class="muted">primitive signatures</div></div><div class="card"><b>${conditions.relational.relations.length}</b><div class="muted">relational testimonies</div></div><div class="card"><b>${conditions.compound.testimonies.length}</b><div class="muted">compound testimonies</div></div></div><div class="researchOnly panel">No experiment currently rewrites condition. Future condition hypotheses require their own model identity, comparison snapshot, and provenance.</div>`;
 document.getElementById('proofContent').innerHTML=`<div class="call"><b>Research constitution</b><br>${lab.audit.pass?'Regime contamination audit passed.':'Regime contamination audit failed.'}</div><div class="grid">${Object.entries(lab.regimes).map(([k,v])=>`<div class="card">${badge(k)}<h3>${esc(k)}</h3><p>${esc(v.purpose)}</p><div class="muted">${esc(v.contamination_rule)}</div></div>`).join('')}</div><div class="researchOnly panel"><h2>Hypothesis registry</h2><table><tr><th>ID</th><th>Domain</th><th>Status</th><th>Question</th></tr>${lab.hypotheses.map(h=>`<tr><td><code>${esc(h.hypothesis_id)}</code></td><td>${esc(h.domain)}</td><td>${esc(h.execution_status)}</td><td>${esc(h.question)}</td></tr>`).join('')}</table><h2>Lifecycle</h2><p>${lab.lifecycle.join(' → ')}</p></div>`;
}
</script></body></html>
