<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Noetic Atlas v0.4.6 — Null Model Laboratory</title><style>
:root{--bg:#080c10;--p:#10171e;--line:#293541;--text:#edf2f5;--muted:#91a0ad;--gold:#d8be73;--cyan:#70b8ba}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.5 system-ui}header{height:76px;padding:8px 12px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;background:#0c1218}h1{font-size:18px;margin:0}.build{font-size:9px;color:var(--gold)}.sub,.muted{color:var(--muted);font-size:10px}nav,.aperture{display:flex;gap:5px}nav{flex:1;overflow:auto}button,select,input{background:#0b1117;color:#cbd3d9;border:1px solid var(--line);border-radius:6px;padding:7px 9px}button{cursor:pointer;white-space:nowrap}button.active{background:var(--gold);color:#111}.aperture button.active{background:var(--cyan)}#workspace{height:calc(100% - 76px)}.view{display:none;height:100%}.view.active{display:block}iframe{border:0;width:100%;height:100%}.scroll{height:100%;overflow:auto;padding:14px;max-width:1500px;margin:auto}.panel,.call,.card{background:var(--p);border:1px solid var(--line);border-radius:9px;padding:11px;margin-bottom:10px}.call{border-left:3px solid var(--gold)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.researchOnly{display:none}body[data-aperture="research"] .researchOnly{display:block}.controls{display:flex;gap:7px;flex-wrap:wrap;align-items:center}table{width:100%;border-collapse:collapse;font-size:10px}th,td{border:1px solid #26313b;padding:6px;text-align:left;vertical-align:top}code{color:var(--gold)}@media(max-width:900px){header{height:126px;display:block}nav,.aperture{margin-top:5px}#workspace{height:calc(100% - 126px)}.grid{grid-template-columns:1fr}}
</style></head><body data-aperture="personal"><header><div><h1>Noetic Atlas <span class="build">v0.4.6 candidate</span></h1><div class="sub">DETECTION ≠ UNEXPECTEDNESS · NAMED COUNTERFACTUALS · NO POPULATION CLAIM</div></div><nav><button class="active" data-view="chart">Chart</button><button data-view="reading">Reading</button><button data-view="resonance">Resonance</button><button data-view="network">Network</button><button data-view="houseflow">House Flow</button><button data-view="condition">Condition</button><button data-view="proof">Proof</button></nav><div class="aperture"><button class="active" data-aperture="personal">Personal</button><button data-aperture="research">Research</button></div></header><div id="workspace"><section id="chart" class="view active"><iframe id="core" src="./index.html?build=v046-core" title="Noetic Atlas deterministic chart core"></iframe></section><section id="reading" class="view"><div class="scroll" id="readingContent"></div></section><section id="resonance" class="view"><div class="scroll" id="resonanceContent"></div></section><section id="network" class="view"><div class="scroll" id="networkContent"></div></section><section id="houseflow" class="view"><div class="scroll" id="riverContent"></div></section><section id="condition" class="view"><div class="scroll" id="conditionContent"></div></section><section id="proof" class="view"><div class="scroll" id="proofContent"></div></section></div>
<script type="module">
import{computeConditionSystem}from'../src/conditions/condition-system.mjs';import{analyzeGraphArchitecture}from'../src/research/graph-analytics-engine.mjs';import{buildHouseResonanceMap}from'../src/interpretation/house-resonance-engine.mjs';import{buildModernRulershipOverlay}from'../src/interpretation/modern-rulership-overlay.mjs';import{buildHouseRiver}from'../src/research/house-river-engine.mjs';import{computeExtendedAspects}from'../src/research/aspect-family-engine.mjs';import{buildV044DiscoverySuite}from'../src/research/v044-discovery-suite.mjs';import{buildResearchLab}from'../src/research/research-lab-engine.mjs';
const core=document.getElementById('core'),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let state=null,last='',nullResult=null,nullBusy=false,nullWorker=null,request=0;
function view(id){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===id));document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===id))}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>view(b.dataset.view));document.querySelectorAll('[data-aperture]').forEach(b=>b.onclick=()=>{document.body.dataset.aperture=b.dataset.aperture;document.querySelectorAll('[data-aperture]').forEach(x=>x.classList.toggle('active',x===b));render()});
function jsonNode(){try{return core.contentDocument?.getElementById('json')}catch{return null}}function sample(){try{const d=core.contentDocument;if(!d?.getElementById('json')?.textContent?.trim()?.startsWith('{'))d?.getElementById('sample')?.click()}catch{}}function sync(){try{const raw=jsonNode()?.textContent?.trim();if(!raw?.startsWith('{')||raw===last)return;last=raw;if(nullWorker){nullWorker.terminate();nullWorker=null}nullResult=null;nullBusy=false;const analysis=JSON.parse(raw),conditions=computeConditionSystem(analysis),graph=analyzeGraphArchitecture(analysis,conditions.primitive),resonance=buildHouseResonanceMap(analysis),modern=buildModernRulershipOverlay(analysis),river=buildHouseRiver(analysis),extended=computeExtendedAspects(analysis),discoveries=buildV044DiscoverySuite({analysis,conditions,graph,resonance,river,modern,extended});state={analysis,conditions,graph,resonance,modern,river,extended,discoveries};render()}catch(e){document.getElementById('networkContent').innerHTML=`<div class="call">Initialization failed: ${esc(e.message)}</div>`}}function attach(){sample();let n=0;const t=setInterval(()=>{n++;sample();const j=jsonNode();if(j){new MutationObserver(sync).observe(j,{childList:true,subtree:true,characterData:true});sync();clearInterval(t)}if(n>50)clearInterval(t)},160)}core.addEventListener('load',attach);attach();
function lab(){return state?buildResearchLab({...state,null_results:nullResult&&!nullResult.error?nullResult:null}):null}const p=x=>Number.isFinite(x)?Number(x).toPrecision(4):'—',pct=x=>Number.isFinite(x)?`${Number(x).toFixed(1)}%`:'—';
function runControls(){return `<div class="researchOnly panel"><h2>Null Model Laboratory</h2><p>Run named counterfactual comparisons explicitly. No null is a population model, and results do not authorize interpretation.</p><div class="controls"><label>Iterations <select id="nullIterations"><option>199</option><option selected>999</option><option>4999</option><option>9999</option></select></label><label>Seed <input id="nullSeed" value="noetic-atlas-v0.4.6-ui"></label><button id="runNulls" ${nullBusy?'disabled':''}>${nullBusy?'Running…':'Run null tests'}</button></div><div class="muted">Finite Monte Carlo +1 correction · Benjamini–Hochberg FDR within each named null family · deterministic RNG.</div></div>`}
function bindRun(){const b=document.getElementById('runNulls');if(!b)return;b.onclick=()=>{if(!state||nullBusy)return;nullBusy=true;nullResult=null;render();nullWorker=new Worker('../src/research/null-model-worker.mjs',{type:'module'});const request_id=++request;nullWorker.onmessage=e=>{if(e.data?.request_id!==request_id)return;nullBusy=false;nullResult=e.data.type==='result'?e.data.result:{error:e.data.error||'Worker error'};nullWorker.terminate();nullWorker=null;render()};nullWorker.postMessage({type:'run',request_id,payload:{...state,iterations:Number(document.getElementById('nullIterations')?.value||999),seed:document.getElementById('nullSeed')?.value||'noetic-atlas-v0.4.6-ui'}})}}
function profile(c){const rows=c?.null_comparison?.comparisons||[];if(!rows.length)return'<div class="muted">detected — no baseline</div>';return `<details><summary>Null profile (${rows.length} separate comparisons)</summary>${rows.map(r=>`<div class="card"><b>${esc(r.null_model_id)}</b> · <code>${esc(r.metric_id)}</code><br>raw p ${p(r.raw_p)} · adjusted p ${p(r.adjusted_p)} · percentile ${pct(r.empirical_percentile)} · ${esc(r.departure_evaluation)}<div class="muted">Preserves: ${(r.preserved_properties||[]).map(esc).join('; ')}<br>Randomizes: ${(r.randomized_properties||[]).map(esc).join('; ')}<br>Can test: ${(r.can_test||[]).map(esc).join('; ')}<br>Cannot test: ${(r.cannot_test||[]).map(esc).join('; ')}<br>Quality: ${esc(r.simulation_quality?.status||'unknown')}</div></div>`).join('')}<div class="muted">These rows are a null profile, not independent replications and not a pass-count.</div></details>`}
function render(){if(!state)return;const L=lab(),{analysis,conditions,graph,resonance,river}=state;document.getElementById('readingContent').innerHTML=`<div class="call"><b>Personal Reading uses the Operational model.</b><br>Research comparisons remain outside the consumer fact set unless Research aperture is active.</div><div class="panel">${analysis.objects.length} objects · ${analysis.aspects.length} canonical relationships.</div><div class="researchOnly panel">${L.discovery.count} Discovery candidates; null comparison changes only that research-status dimension.</div>`;document.getElementById('resonanceContent').innerHTML=`<div class="call">Actual Whole-Sign field and traditional ruler remain primary.</div><div class="panel">1H ${esc(resonance.houses[0].actual.sign)} · ruler ${esc(resonance.houses[0].actual.ruler)}</div>`;document.getElementById('networkContent').innerHTML=`<div class="call">Canonical aspect + traditional dispositor network.</div><div class="grid"><div class="card"><b>${graph.graphs.classical_dispositor.terminal_basins.length}</b><div class="muted">terminal basins</div></div><div class="card"><b>${analysis.aspects.length}</b><div class="muted">canonical aspects</div></div><div class="card"><b>${river.planetary_bands.length}</b><div class="muted">House River bands</div></div></div>${runControls()}<div class="researchOnly panel"><h2>Discovery candidates</h2>${L.discovery.candidates.slice(0,30).map(c=>`<div class="card"><b>${esc(c.candidate_id)}</b><p>${esc(c.description)}</p><div class="muted">${esc(c.promotion_state)} · population frequency ${esc(c.model_identity.status.population_frequency)} · interpretation ${esc(c.model_identity.status.interpretation)}</div>${profile(c)}</div>`).join('')}</div>`;document.getElementById('riverContent').innerHTML=`<div class="call">House Flow remains a projection of the traditional ruler graph.</div><div class="panel"><table>${river.houses.map(x=>`<tr><td>${x.house}H</td><td>${esc(x.entry_ruler)}</td><td>${esc((x.route||[]).join(' → '))}</td></tr>`).join('')}</table></div>`;document.getElementById('conditionContent').innerHTML=`<div class="call">Primitive, relational, and compound condition remain Operational.</div><div class="grid"><div class="card">${Object.keys(conditions.primitive.by_planet||{}).length} primitive signatures</div><div class="card">${conditions.relational.relations.length} relational testimonies</div><div class="card">${conditions.compound.testimonies.length} compound testimonies</div></div>`;const nr=nullResult&&!nullResult.error?nullResult:null;document.getElementById('proofContent').innerHTML=`<div class="call"><b>Research constitution</b><br>${L.audit.pass?'Regime contamination audit passed.':'Regime contamination audit failed.'} Detection and unexpectedness remain separate claims.</div><div class="researchOnly panel"><h2>Counterfactual boundary</h2><p>${esc(L.counterfactual_boundary.claim_ceiling)}</p><div class="muted">Population frequency: ${esc(L.counterfactual_boundary.population_frequency)} · Interpretation: ${esc(L.counterfactual_boundary.interpretation)}</div>${nullResult?.error?`<div class="call">Null run failed: ${esc(nullResult.error)}</div>`:''}${nr?`<h2>Simulation ledger</h2><p><code>${esc(nr.run_id)}</code> · ${nr.iterations} iterations/null · RNG ${esc(nr.rng.algorithm)}</p><table><tr><th>Null</th><th>Metric</th><th>raw p</th><th>adjusted p</th><th>Percentile</th><th>Family</th></tr>${nr.experiments.map(e=>`<tr><td>${esc(e.null_model.id)}</td><td><code>${esc(e.metric.metric_id)}</code></td><td>${p(e.raw_p)}</td><td>${p(e.adjusted_p)}</td><td>${pct(e.empirical_percentile)}</td><td>${esc(e.multiple_testing.family_id)}</td></tr>`).join('')}</table>`:'<p>No null experiment has been run. Research mode never auto-runs simulations.</p>'}<p>${L.lifecycle.join(' → ')}</p></div>`;bindRun()}
</script></body></html>
