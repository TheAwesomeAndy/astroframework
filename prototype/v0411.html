<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Noetic Atlas v0.4.1.1 — Astrological Analysis Observatory</title>
<style>
:root{--bg:#080c10;--panel:#10171e;--panel2:#0b1117;--line:#293541;--text:#edf2f5;--muted:#91a0ad;--gold:#d8be73;--green:#83c39b;--violet:#ac96d0;--cyan:#70b8ba}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:13px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
#core{position:fixed;left:0;top:0;width:calc(100% - 560px);height:100%;border:0;background:#0a0e12}#dock{position:fixed;right:0;top:0;width:560px;height:100%;overflow:auto;background:var(--panel);border-left:1px solid var(--line);z-index:20}.dockHead{position:sticky;top:0;background:#10171ef7;border-bottom:1px solid var(--line);padding:14px;z-index:5}.dockHead h1{font-size:17px;margin:0 0 2px}.eyebrow{font:9px/1.4 ui-monospace,monospace;color:var(--gold);letter-spacing:.08em}.model{font:9px/1.4 ui-monospace,monospace;color:#9caab5;word-break:break-all}.tabs,.filters,.nodes,.conditionButtons{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}.tabs button,.filters button,.chip,.nodeChip,.conditionButtons button{background:var(--panel2);color:#c5cfd7;border:1px solid var(--line);border-radius:6px;padding:6px 8px;cursor:pointer;font:inherit}.tabs button.active,.filters button.active,.conditionButtons button.active{background:var(--gold);color:#111;border-color:var(--gold)}.pane{display:none;padding:14px}.pane.active{display:block}.call{padding:10px;border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:8px;background:var(--panel2);font-size:10px;margin-bottom:10px}.summaryGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-bottom:12px}.summary{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px}.summary b{display:block;font-size:16px;color:var(--gold)}.summary span{font-size:9px;color:var(--muted)}.card{background:var(--panel2);border:1px solid var(--line);border-radius:9px;margin:10px 0;overflow:hidden}.cardHead{padding:10px;border-bottom:1px solid #26313b}.cardHead h2{font-size:13px;margin:3px 0}.tag{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:1px 6px;font-size:8px;color:var(--muted);margin-right:4px}.tag.interpretive{border-color:var(--cyan);color:var(--cyan)}.tag.research{border-color:var(--violet);color:var(--violet)}.body{padding:10px}.analysisP{font-size:10.5px;margin:0 0 9px;color:#e2e9ed}.life{border-left:3px solid var(--gold);padding:8px;background:#111820;margin:9px 0;font-size:10px}.section{border-top:1px solid #24303a;padding:7px 0}.section h3{font-size:9px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 3px}.section p{font-size:10px;margin:0}.measure,.proof,.integrityBox{font:9px/1.45 ui-monospace,monospace;color:#b9c5cd;background:#080d12;border:1px solid #222c36;border-radius:6px;padding:7px;white-space:pre-wrap;word-break:break-word}.nodeChip{font-size:9px;padding:3px 6px}.metricValue{font-size:19px;color:var(--gold);font-weight:700}.limits{font-size:9px;color:#acb7bf;margin:4px 0 0 15px;padding:0}details{border-top:1px solid #26313b;padding:7px 0}summary{cursor:pointer;font-size:9px;color:#cbd4da}.fact{display:grid;grid-template-columns:135px 1fr;gap:8px;padding:6px 0;border-bottom:1px solid #222d37;font-size:10px}.k{color:var(--muted)}.present{color:var(--gold);font-weight:700}.in_sect{color:var(--green);font-weight:700}.out_of_sect{color:#e3a1a1;font-weight:700}.toggle{position:fixed;right:564px;top:8px;z-index:30;background:#111922;color:var(--gold);border:1px solid #485662;border-radius:7px;padding:7px 9px;cursor:pointer}.closed #dock{display:none}.closed #core{width:100%}.closed .toggle{right:8px}.empty{color:var(--muted);font-size:11px;margin-top:14px}
@media(max-width:980px){#core{width:100%}#dock{width:min(97vw,560px);box-shadow:-8px 0 28px #000b}.toggle{right:min(calc(97vw + 4px),564px)}.closed .toggle{right:8px}}
</style>
</head>
<body>
<button class="toggle" id="toggle">Analysis ▸</button>
<iframe id="core" src="./index.html?build=v0411-interpretive-outers" title="Noetic Atlas core"></iframe>
<aside id="dock">
<div class="dockHead"><h1>Noetic Atlas <span style="color:var(--gold)">v0.4.1.1</span></h1><div class="eyebrow">ASTROLOGICAL ANALYSIS + GRAPH INTEGRITY</div><div class="model">naf.interpretation.astrological_analysis.v0.4.1.1 · naf.research.graph_analytics.v0.4.1</div><div class="tabs"><button class="active" data-pane="analysisPane">Analysis</button><button data-pane="findingsPane">Findings</button><button data-pane="metricsPane">Metrics</button><button data-pane="conditionPane">Condition</button><button data-pane="integrityPane">Integrity</button></div></div>
<section id="analysisPane" class="pane active"></section><section id="findingsPane" class="pane"></section><section id="metricsPane" class="pane"></section><section id="conditionPane" class="pane"></section><section id="integrityPane" class="pane"></section>
</aside>
<script type="module">
import {computePrimitiveConditions,CLASSICAL_PLANETS} from '../src/conditions/primitive-condition-engine.mjs';
import {analyzeGraphArchitecture} from '../src/research/graph-analytics-engine.mjs';
import {buildAstrologicalAnalysis} from '../src/interpretation/astrological-analysis-engine.mjs';
const core=document.getElementById('core'),body=document.body,toggle=document.getElementById('toggle');
let analysis=null,conditions=null,graph=null,astro=null,selectedProof=null,chosen='Sun',filter='featured',observer=null;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const pretty=x=>JSON.stringify(x,null,2);const cls=s=>['present','in_sect','out_of_sect'].includes(s)?s:'';
toggle.onclick=()=>{body.classList.toggle('closed');toggle.textContent=body.classList.contains('closed')?'Analysis ◂':'Analysis ▸'};
document.querySelectorAll('[data-pane]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-pane]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('active',p.id===b.dataset.pane));if(b.dataset.pane==='integrityPane')renderIntegrity()});
function patchCoreBrand(){try{const d=core.contentDocument;if(!d)return;d.title='Noetic Atlas v0.4.1.1 — Astrological Analysis Observatory';const v=d.querySelector('.brand h1 small');if(v)v.textContent='v0.4.1.1 · ASTROLOGICAL ANALYSIS';}catch{}}
function clickCoreNode(id){try{const d=core.contentDocument,field=d.querySelector('.tabs button[data-view="field"]');if(field)field.click();const groups=[...d.querySelectorAll('#fieldSvg g')],g=groups.find(el=>[...el.querySelectorAll('text')].some(t=>t.textContent.trim()===id));if(g)g.dispatchEvent(new MouseEvent('click',{bubbles:true,view:core.contentWindow}));}catch{}if(CLASSICAL_PLANETS.includes(id)){chosen=id;renderCondition()}}
function nodeChips(nodes=[]){return nodes.length?`<div class="nodes">${nodes.map(n=>`<button class="nodeChip" data-node="${esc(n)}">${esc(n)}</button>`).join('')}</div>`:''}
function wire(root=document){root.querySelectorAll('[data-node]').forEach(b=>b.onclick=()=>clickCoreNode(b.dataset.node));root.querySelectorAll('[data-integrity-index]').forEach(b=>b.onclick=()=>{selectedProof=currentAnalysis()[Number(b.dataset.integrityIndex)];document.querySelector('[data-pane="integrityPane"]').click()});root.querySelectorAll('[data-finding-index]').forEach(b=>b.onclick=()=>{selectedProof=graph.findings[Number(b.dataset.findingIndex)];document.querySelector('[data-pane="integrityPane"]').click()});root.querySelectorAll('[data-metric-index]').forEach(b=>b.onclick=()=>{selectedProof=graph.metrics[Number(b.dataset.metricIndex)];document.querySelector('[data-pane="integrityPane"]').click()})}
function currentAnalysis(){if(!astro)return[];if(filter==='outer')return astro.outer_planets;if(filter==='config')return astro.configurations;if(filter==='topology')return astro.topology;if(filter==='placements')return astro.placements;if(filter==='aspects')return astro.tight_aspects;return astro.featured}
function sync(){patchCoreBrand();try{const raw=core.contentDocument?.getElementById('json')?.textContent?.trim();if(!raw||!raw.startsWith('{'))return;analysis=JSON.parse(raw);conditions=computePrimitiveConditions(analysis);graph=analyzeGraphArchitecture(analysis,conditions);astro=buildAstrologicalAnalysis(analysis,graph,conditions);renderAll()}catch(e){console.warn('v0.4.1.1 sync',e)}}
function renderAnalysis(){const box=document.getElementById('analysisPane');if(!astro){box.innerHTML='<div class="empty">Calculate or load a chart. Astrological synthesis will appear after the deterministic chart and graph state exist.</div>';return}const list=currentAnalysis();box.innerHTML=`<div class="call"><b>Interpretation is downstream of evidence.</b><br>The prose below is an astrological synthesis of placements, houses, aspects, motifs, graph topology, and classical condition. It is deliberately separated from astronomical calculation and graph derivation. Outer planets participate fully here through modern/transpersonal placement and aspect analysis; they do not inherit Hellenistic dignity.</div><div class="summaryGrid"><div class="summary"><b>${astro.outer_planets.length}</b><span>outer planets analyzed</span></div><div class="summary"><b>${astro.configurations.length}</b><span>typed configurations interpreted</span></div><div class="summary"><b>${astro.tight_aspects.length}</b><span>tight ≤3° aspects interpreted</span></div><div class="summary"><b>${astro.topology.length}</b><span>topology syntheses</span></div></div><div class="filters">${[['featured','Featured'],['outer','Outer planets'],['config','Configurations'],['topology','Topology'],['placements','All placements'],['aspects','Tight aspects']].map(([k,l])=>`<button class="${filter===k?'active':''}" data-filter="${k}">${l}</button>`).join('')}</div>${list.map((a,i)=>`<article class="card"><div class="cardHead"><span class="tag interpretive">interpretive-inference</span><span class="tag">${esc(a.category)}</span><h2>${esc(a.title)}</h2>${nodeChips(a.planets||[])}</div><div class="body">${a.astrological_analysis.map(p=>`<p class="analysisP">${esc(p)}</p>`).join('')}<div class="life"><b>Life / material expression</b><br>${esc(a.livelihood_relevance)}</div><details><summary>Evidence used</summary><div class="proof">${esc(pretty(a.evidence))}</div></details><button class="chip" data-integrity-index="${i}">Why this analysis?</button></div></article>`).join('')||'<div class="empty">No analyses in this category for the current chart.</div>'}`;box.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;renderAnalysis()});wire(box)}
function renderFindings(){const box=document.getElementById('findingsPane');if(!graph){box.innerHTML='<div class="empty">No graph findings yet.</div>';return}box.innerHTML=`<div class="call"><b>Graph findings are evidence, not the final reading.</b><br>These cards state the structural result first. Use the Analysis tab for the downstream astrological delineation.</div>${graph.findings.map((f,i)=>`<article class="card"><div class="cardHead"><span class="tag research">research-exploratory</span><span class="tag">${esc(f.category)}</span><h2>${esc(f.title)}</h2>${nodeChips(f.scope?.nodes||[])}</div><div class="body"><p class="analysisP">${esc(f.statement)}</p><div class="measure">${esc(pretty(f.measurement))}</div><div class="section"><h3>Graph-theory meaning</h3><p>${esc(f.readable_analysis.graph_theory_meaning)}</p></div><div class="section"><h3>Astrological context</h3><p>${esc(f.readable_analysis.astrological_context)}</p></div><div class="section"><h3>Interpretive hypothesis</h3><p>${esc(f.readable_analysis.interpretive_hypothesis)}</p></div><details><summary>Proof</summary><div class="proof">${esc(pretty(f.integrity))}</div></details><button class="chip" data-finding-index="${i}">Open integrity</button></div></article>`).join('')}`;wire(box)}
function renderMetrics(){const box=document.getElementById('metricsPane');if(!graph){box.innerHTML='<div class="empty">No metrics yet.</div>';return}box.innerHTML=`<div class="call"><b>No naked metrics.</b><br>Every value remains attached to its formula, meaning, limits, and provenance. No metric is called rare or dominant without a comparison model.</div>${graph.metrics.map((m,i)=>`<article class="card"><div class="cardHead"><span class="tag research">research-exploratory</span><h2>${esc(m.label)}</h2><span class="metricValue">${esc(m.value)}</span> <span class="k">${esc(m.unit||'')}</span></div><div class="body"><div class="section"><h3>Definition</h3><p>${esc(m.definition)}</p><div class="measure">${esc(m.formula)}</div></div><div class="section"><h3>Observation</h3><p>${esc(m.readable_analysis.observation)}</p></div><div class="section"><h3>Graph meaning</h3><p>${esc(m.readable_analysis.graph_theory_meaning)}</p></div><div class="section"><h3>Astrological context</h3><p>${esc(m.readable_analysis.astrological_context)}</p></div><details><summary>Calculation proof</summary><div class="proof">${esc(pretty(m.integrity))}</div></details><button class="chip" data-metric-index="${i}">Open integrity</button></div></article>`).join('')}`;wire(box)}
function statusLine(f,label){if(!f)return`<div class="fact"><span class="k">${esc(label)}</span><span>—</span></div>`;const s=f.status||'—';return`<div class="fact"><span class="k">${esc(label)}</span><span class="${cls(s)}">${esc(s)}${f.present===true?' · yes':f.present===false?' · no':''}</span></div>`}
function renderCondition(){const box=document.getElementById('conditionPane');if(!conditions){box.innerHTML='<div class="empty">No classical condition state yet.</div>';return}const rec=conditions.by_planet[chosen]||conditions.by_planet.Sun,e=rec.essential,s=rec.sect,p=rec.positional.angularity;box.innerHTML=`<div class="call"><b>Classical condition only.</b><br>Uranus, Neptune, and Pluto are intentionally absent from Hellenistic dignity. Their analysis is in the Analysis tab through placement, houses, aspects, motifs, and graph participation.</div><div class="conditionButtons">${CLASSICAL_PLANETS.map(x=>`<button data-cp="${x}" class="${x===rec.planet?'active':''}">${x}</button>`).join('')}</div><h2>${esc(rec.planet)} · ${esc(rec.identity.sign)} ${rec.identity.degree_in_sign.toFixed(2)}° · ${rec.identity.computed_house}H</h2>${statusLine(e.domicile,'Domicile')}${statusLine(e.adversity,'Adversity')}${statusLine(e.exaltation,'Exaltation')}${statusLine(e.depression,'Depression / fall')}<div class="fact"><span class="k">Triplicity</span><span>${esc(e.triplicity.planet_roles.join(', ')||'none')}${e.triplicity.active_for_chart?' · active sect ruler':''}</span></div><div class="fact"><span class="k">Egyptian bound</span><span>${esc(e.bound.bound_ruler)} [${e.bound.start_deg},${e.bound.end_deg})</span></div><div class="fact"><span class="k">Sect condition</span><span class="${cls(s.condition.status)}">${esc(s.condition.status)}</span></div><div class="fact"><span class="k">Angularity</span><span>${esc(p.class)} · ${p.house}H</span></div><details><summary>Primitive condition ledger</summary><div class="proof">${esc(pretty(rec.ledger_entries))}</div></details>`;box.querySelectorAll('[data-cp]').forEach(b=>b.onclick=()=>{chosen=b.dataset.cp;renderCondition();clickCoreNode(chosen)})}
function renderIntegrity(){const box=document.getElementById('integrityPane');if(!analysis){box.innerHTML='<div class="empty">No state yet.</div>';return}box.innerHTML=`<div class="call"><b>Integrity contract</b><br>Input/astronomy → astrological rule → graph derivation → interpretive inference. The selected analysis never replaces the lower layers.</div><h3>Selected evidence object</h3><div class="integrityBox">${esc(pretty(selectedProof||astro?.integrity||graph?.integrity||{}))}</div><details><summary>Full interpretive state</summary><div class="proof">${esc(pretty(astro))}</div></details><details><summary>Full graph state</summary><div class="proof">${esc(pretty(graph))}</div></details>`}
function renderAll(){renderAnalysis();renderFindings();renderMetrics();renderCondition();renderIntegrity()}
core.addEventListener('load',()=>{patchCoreBrand();try{const d=core.contentDocument,j=d.getElementById('json'),ins=d.getElementById('inspector'),status=d.getElementById('status');observer?.disconnect();observer=new MutationObserver(sync);if(j)observer.observe(j,{childList:true,characterData:true,subtree:true});if(ins)observer.observe(ins,{childList:true,characterData:true,subtree:true});if(status)observer.observe(status,{childList:true,characterData:true,subtree:true});sync()}catch(e){console.warn(e)}});
</script>
</body></html>
