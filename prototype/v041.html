<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Noetic Atlas v0.4.1 — Graph Analytics & Explainable Findings</title>
<style>
:root{--bg:#080c10;--panel:#10171e;--panel2:#0b1117;--line:#293541;--text:#edf2f5;--muted:#91a0ad;--gold:#d8be73;--green:#83c39b;--red:#d28282;--blue:#82b2d7;--violet:#ac96d0;--cyan:#70b8ba}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:13px/1.48 system-ui,-apple-system,Segoe UI,sans-serif}
#core{position:fixed;left:0;top:0;width:calc(100% - 520px);height:100%;border:0;background:#0a0e12}
#dock{position:fixed;right:0;top:0;width:520px;height:100%;overflow:auto;background:var(--panel);border-left:1px solid var(--line);z-index:20}
.dockHead{position:sticky;top:0;background:#10171ef7;border-bottom:1px solid var(--line);padding:14px;z-index:5}.dockHead h1{font-size:17px;margin:0 0 2px}.eyebrow{font:9px/1.4 ui-monospace,monospace;color:var(--gold);letter-spacing:.08em}.model{font:9px/1.4 ui-monospace,monospace;color:#9caab5;word-break:break-all}.dockTabs{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}.dockTabs button,.chip,.nodeChip{background:var(--panel2);color:#c5cfd7;border:1px solid var(--line);border-radius:6px;padding:6px 8px;cursor:pointer;font:inherit}.dockTabs button.active,.nodeChip.active{background:var(--gold);color:#111;border-color:var(--gold)}.pane{display:none;padding:14px}.pane.active{display:block}.call{padding:9px;border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:7px;background:var(--panel2);font-size:10px;margin-bottom:10px}.summaryGrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:12px}.summary{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px}.summary b{display:block;font-size:16px;color:var(--gold)}.summary span{font-size:9px;color:var(--muted)}.finding,.metricCard{background:var(--panel2);border:1px solid var(--line);border-radius:9px;margin:9px 0;overflow:hidden}.findingHead,.metricHead{padding:10px;border-bottom:1px solid #26313b}.findingHead h2,.metricHead h2{font-size:13px;margin:2px 0}.tag{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:1px 6px;font-size:8px;color:var(--muted);margin-right:4px}.tag.research{border-color:var(--violet);color:var(--violet)}.findingBody,.metricBody{padding:10px}.statement{font-size:11px;color:#e7edf1;margin-bottom:8px}.section{border-top:1px solid #24303a;padding:7px 0}.section:first-of-type{border-top:0}.section h3{font-size:9px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 3px}.section p{font-size:10px;margin:0}.hypothesis{border-left:2px solid var(--violet);padding-left:7px}.limits{margin:4px 0 0 16px;padding:0;font-size:9px;color:#acb7bf}.nodes{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}.nodeChip{font-size:9px;padding:3px 6px}.measure{font:9px/1.45 ui-monospace,monospace;color:#b9c5cd;background:#080d12;border:1px solid #222c36;border-radius:6px;padding:6px;white-space:pre-wrap;word-break:break-word}.metricValue{font-size:20px;color:var(--gold);font-weight:700}.metricUnit{font-size:9px;color:var(--muted)}details{border-top:1px solid #26313b;padding:7px 0}summary{cursor:pointer;font-size:9px;color:#cbd4da}.proof{font:8.5px/1.45 ui-monospace,monospace;white-space:pre-wrap;word-break:break-word;color:#aebbc4;margin-top:5px}.conditionButtons{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}.conditionButtons button{background:var(--panel2);color:#c5cfd7;border:1px solid var(--line);border-radius:6px;padding:5px 7px;cursor:pointer}.conditionButtons button.active{background:var(--gold);color:#111}.fact{display:grid;grid-template-columns:135px 1fr;gap:8px;padding:6px 0;border-bottom:1px solid #222d37;font-size:10px}.k{color:var(--muted)}.present{color:var(--gold);font-weight:700}.in_sect{color:var(--green);font-weight:700}.out_of_sect{color:#e3a1a1;font-weight:700}.integrityBox{font:9px/1.45 ui-monospace,monospace;white-space:pre-wrap;word-break:break-word;background:#080d12;border:1px solid var(--line);padding:8px;border-radius:7px}.toggle{position:fixed;right:524px;top:8px;z-index:30;background:#111922;color:var(--gold);border:1px solid #485662;border-radius:7px;padding:7px 9px;cursor:pointer}.closed #dock{display:none}.closed #core{width:100%}.closed .toggle{right:8px}.empty{color:var(--muted);font-size:11px;margin-top:14px}
@media(max-width:980px){#core{width:100%;height:100%}#dock{width:min(96vw,520px);box-shadow:-8px 0 28px #000b}.toggle{right:min(calc(96vw + 4px),524px)}.closed .toggle{right:8px}.summaryGrid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<button class="toggle" id="toggle">Analysis ▸</button>
<iframe id="core" src="./index.html?build=v041-graph-findings" title="Noetic Atlas v0.4.1"></iframe>
<aside id="dock">
  <div class="dockHead">
    <h1>Noetic Atlas <span style="color:var(--gold)">v0.4.1</span></h1>
    <div class="eyebrow">GRAPH ANALYTICS + EXPLAINABLE FINDINGS</div>
    <div class="model">naf.research.graph_analytics.v0.4.1 · naf.finding.explainable.v0.4.1</div>
    <div class="dockTabs"><button class="active" data-pane="findings">Findings</button><button data-pane="metrics">Metrics</button><button data-pane="condition">Condition</button><button data-pane="integrity">Integrity</button></div>
  </div>
  <section id="findings" class="pane active"></section>
  <section id="metrics" class="pane"></section>
  <section id="condition" class="pane"></section>
  <section id="integrity" class="pane"></section>
</aside>
<script type="module">
import {computePrimitiveConditions,CLASSICAL_PLANETS} from '../src/conditions/primitive-condition-engine.mjs';
import {analyzeGraphArchitecture} from '../src/research/graph-analytics-engine.mjs';
const core=document.getElementById('core'),body=document.body,toggle=document.getElementById('toggle');
const panes=['findings','metrics','condition','integrity'];
let analysis=null,conditions=null,graph=null,chosen='Sun',observer=null,selectedProof=null;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cls=s=>['present','in_sect','out_of_sect'].includes(s)?s:'';
const pretty=x=>JSON.stringify(x,null,2);
toggle.onclick=()=>{body.classList.toggle('closed');toggle.textContent=body.classList.contains('closed')?'Analysis ◂':'Analysis ▸'};
document.querySelectorAll('[data-pane]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-pane]').forEach(x=>x.classList.toggle('active',x===b));panes.forEach(id=>document.getElementById(id).classList.toggle('active',id===b.dataset.pane));if(b.dataset.pane==='integrity')renderIntegrity()});

function patchCoreBrand(){try{const doc=core.contentDocument;if(!doc)return;doc.title='Noetic Atlas v0.4.1 — Graph Analytics & Explainable Findings';const version=doc.querySelector('.brand h1 small');if(version)version.textContent='v0.4.1 · GRAPH ANALYTICS';}catch{}}
function selectedFromCore(){try{const title=core.contentDocument?.querySelector('#inspector h2')?.textContent?.trim();return CLASSICAL_PLANETS.includes(title)?title:null}catch{return null}}
function clickCoreNode(id){
  try{
    const doc=core.contentDocument,field=doc.querySelector('.tabs button[data-view="field"]');if(field)field.click();
    const groups=[...doc.querySelectorAll('#fieldSvg g')],g=groups.find(el=>[...el.querySelectorAll('text')].some(t=>t.textContent.trim()===id));
    if(g)g.dispatchEvent(new MouseEvent('click',{bubbles:true,view:core.contentWindow}));
  }catch{}
  if(CLASSICAL_PLANETS.includes(id)){chosen=id;renderCondition()}
}
function showProof(obj){selectedProof=obj;document.querySelector('[data-pane="integrity"]').click()}
function sync(){
  patchCoreBrand();
  try{
    const json=core.contentDocument?.getElementById('json')?.textContent?.trim();
    if(!json||!json.startsWith('{'))return;
    analysis=JSON.parse(json);conditions=computePrimitiveConditions(analysis);graph=analyzeGraphArchitecture(analysis,conditions);
    const selected=selectedFromCore();if(selected)chosen=selected;
    renderAll();
  }catch(e){console.warn('v0.4.1 sync',e)}
}
function nodeChips(nodes=[]){return nodes.length?`<div class="nodes">${nodes.map(n=>`<button class="nodeChip" data-node="${esc(n)}">${esc(n)}</button>`).join('')}</div>`:''}
function wireNodes(root=document){root.querySelectorAll('[data-node]').forEach(b=>b.onclick=()=>clickCoreNode(b.dataset.node));root.querySelectorAll('[data-proof]').forEach(b=>b.onclick=()=>{const kind=b.dataset.proof,idx=Number(b.dataset.index);showProof(kind==='finding'?graph.findings[idx]:graph.metrics[idx])})}
function renderFindings(){
  const box=document.getElementById('findings');
  if(!graph){box.innerHTML='<div class="empty">Calculate or load a chart in the observatory. Findings will appear here after deterministic graph derivation.</div>';return}
  const fd=graph.graphs.classical_dispositor,ag=graph.graphs.aspect;
  const basin=[...fd.terminal_basins].sort((a,b)=>b.basin_size-a.basin_size)[0],bottle=fd.nonterminal_bottlenecks[0];
  box.innerHTML=`<div class="call"><b>The graph is not the conclusion.</b><br>Each finding separates the exact mathematical result from astrological rule context and from the downstream interpretive hypothesis. Open <b>Proof</b> to see formula, inputs, outputs, and ledger references.</div>
  <div class="summaryGrid">
    <div class="summary"><b>${basin?Math.round(basin.basin_fraction*100):0}%</b><span>largest classical terminal-basin capture</span></div>
    <div class="summary"><b>${fd.max_route_depth}</b><span>maximum ruler-route depth</span></div>
    <div class="summary"><b>${bottle?esc(bottle.node):'—'}</b><span>largest preterminal path bottleneck</span></div>
    <div class="summary"><b>${ag.recognized_motifs.length}</b><span>recognized typed aspect motifs</span></div>
  </div>
  ${graph.findings.map((f,i)=>`<article class="finding"><div class="findingHead"><span class="tag research">research-exploratory</span><span class="tag">${esc(f.category)}</span><h2>${esc(f.title)}</h2></div><div class="findingBody"><div class="statement">${esc(f.statement)}</div><div class="measure">${esc(pretty(f.measurement))}</div>${nodeChips(f.scope?.nodes||[])}<div class="section"><h3>Graph-theory meaning</h3><p>${esc(f.readable_analysis.graph_theory_meaning)}</p></div><div class="section"><h3>Astrological rule context</h3><p>${esc(f.readable_analysis.astrological_context)}</p></div><div class="section hypothesis"><h3>Interpretive hypothesis · not validated</h3><p>${esc(f.readable_analysis.interpretive_hypothesis)}</p></div><div class="section"><h3>Limits</h3><ul class="limits">${f.readable_analysis.limits.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><details><summary>Proof · formula, inputs, outputs, ledger</summary><div class="proof">${esc(pretty(f.integrity))}</div></details><button class="chip" data-proof="finding" data-index="${i}">Open integrity view</button></div></article>`).join('')}`;
  wireNodes(box);
}
function renderMetrics(){
  const box=document.getElementById('metrics');
  if(!graph){box.innerHTML='<div class="empty">No graph analysis yet.</div>';return}
  box.innerHTML=`<div class="call"><b>No naked metrics.</b><br>A value is shown only with its definition, formula, structural meaning, rule context, interpretive status, and limitations. v0.4.1 deliberately does not call a metric “high,” “low,” “strong,” or “important” without a comparison/null model.</div>${graph.metrics.map((m,i)=>`<article class="metricCard"><div class="metricHead"><span class="tag research">${esc(m.epistemic_layer)}</span><h2>${esc(m.label)}</h2><span class="metricValue">${esc(typeof m.value==='number'?m.value:m.value)}</span> <span class="metricUnit">${esc(m.unit||'')}</span></div><div class="metricBody"><div class="section"><h3>Definition</h3><p>${esc(m.definition)}</p><div class="measure" style="margin-top:5px">${esc(m.formula)}</div></div><div class="section"><h3>Observation</h3><p>${esc(m.readable_analysis.observation)}</p></div><div class="section"><h3>Graph-theory meaning</h3><p>${esc(m.readable_analysis.graph_theory_meaning)}</p></div><div class="section"><h3>Astrological context</h3><p>${esc(m.readable_analysis.astrological_context)}</p></div><div class="section hypothesis"><h3>Interpretive hypothesis · not validated</h3><p>${esc(m.readable_analysis.interpretive_hypothesis)}</p></div><div class="section"><h3>Limits</h3><ul class="limits">${m.readable_analysis.limits.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><details><summary>Calculation proof</summary><div class="proof">${esc(pretty(m.integrity))}</div></details><button class="chip" data-proof="metric" data-index="${i}">Open integrity view</button></div></article>`).join('')}`;
  wireNodes(box);
}
function statusLine(f,label){if(!f)return`<div class="fact"><span class="k">${esc(label)}</span><span>—</span></div>`;const s=f.status||'—';return`<div class="fact"><span class="k">${esc(label)}</span><span class="${cls(s)}">${esc(s)}${f.present===true?' · yes':f.present===false?' · no':''}</span></div>`}
function renderCondition(){
  const box=document.getElementById('condition');if(!conditions){box.innerHTML='<div class="empty">No condition analysis yet.</div>';return}
  const rec=conditions.by_planet[chosen]||conditions.by_planet.Sun,e=rec.essential,s=rec.sect,p=rec.positional.angularity,roles=e.triplicity.planet_roles.length?e.triplicity.planet_roles.join(', '):'none';
  box.innerHTML=`<div class="call"><b>Condition remains decomposed.</b><br>This panel is node state. It does not collapse dignity, sect, bound, or angularity into a strength score. Graph findings may reference these records, but the layers remain distinct.</div><div class="conditionButtons">${CLASSICAL_PLANETS.map(x=>`<button data-cp="${x}" class="${x===rec.planet?'active':''}">${x}</button>`).join('')}</div><h2 style="font-size:14px;margin:10px 0 5px">${esc(rec.planet)} <span style="color:var(--muted);font-size:10px">${esc(rec.identity.sign)} ${rec.identity.degree_in_sign.toFixed(3)}° · ${rec.identity.computed_house}H</span></h2><div>${statusLine(e.domicile,'Domicile')}${statusLine(e.adversity,'Adversity')}${statusLine(e.exaltation,'Exaltation')}${statusLine(e.depression,'Depression / fall')}<div class="fact"><span class="k">Triplicity</span><span>${esc(e.triplicity.element)} · ${esc(roles)}${e.triplicity.active_for_chart?' · active sect ruler':''}</span></div><div class="fact"><span class="k">Egyptian bound</span><span>${esc(e.bound.bound_ruler)} · [${e.bound.start_deg},${e.bound.end_deg})${e.bound.self_ruled?' · own bound':''}</span></div><div class="fact"><span class="k">Chart sect</span><span>${esc(s.chart_sect)}</span></div><div class="fact"><span class="k">Planet sect family</span><span>${esc(s.planetary_family.family)}${s.planetary_family.phase?' · '+esc(s.planetary_family.phase):''}</span></div><div class="fact"><span class="k">Sect condition</span><span class="${cls(s.condition.status)}">${esc(s.condition.status)}</span></div><div class="fact"><span class="k">Angularity</span><span>${esc(p.class)} · ${p.house}H</span></div></div><h3 style="font-size:10px;margin:12px 0 4px">Derivation ledger · ${rec.ledger_entries.length} factor entries</h3>${rec.ledger_entries.map(x=>`<details><summary>${esc(x.kind.replace('condition_',''))} · ${esc(x.result?.status||x.result?.class||x.result?.family||'derived')}</summary><div class="proof">${esc(pretty(x))}</div></details>`).join('')}`;
  box.querySelectorAll('[data-cp]').forEach(b=>b.onclick=()=>{chosen=b.dataset.cp;clickCoreNode(chosen);renderCondition()});
}
function renderIntegrity(){
  const box=document.getElementById('integrity');if(!graph){box.innerHTML='<div class="empty">No derivation state yet.</div>';return}
  const focus=selectedProof||graph.findings[0]||graph.metrics[0];
  box.innerHTML=`<div class="call"><b>Integrity contract</b><br>Graph fact → rule context → interpretive hypothesis. A finding never upgrades its hypothesis into a mathematical result.</div><div class="section"><h3>Analytics models</h3><div class="integrityBox">${esc(pretty({graph_model:graph.model,finding_model:graph.finding_model,status:graph.status,restrictions:graph.restrictions}))}</div></div><div class="section"><h3>Selected proof object</h3><div class="integrityBox">${esc(pretty(focus))}</div></div><div class="section"><h3>Underlying derivation ledger</h3><p>${analysis?.derivation_ledger?.length||0} structural/rule ledger entries exist in the core analysis. Finding proof objects reference those entries by stable kind/id strings.</p></div>`;
}
function renderAll(){renderFindings();renderMetrics();renderCondition();renderIntegrity()}
core.addEventListener('load',()=>{try{patchCoreBrand();const doc=core.contentDocument,json=doc.getElementById('json'),ins=doc.getElementById('inspector'),status=doc.getElementById('status');observer?.disconnect();observer=new MutationObserver(()=>sync());if(json)observer.observe(json,{childList:true,characterData:true,subtree:true});if(ins)observer.observe(ins,{childList:true,characterData:true,subtree:true});if(status)observer.observe(status,{childList:true,characterData:true,subtree:true});sync()}catch(e){console.warn(e)}});
renderAll();
</script>
</body>
</html>
