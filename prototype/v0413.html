<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Noetic Atlas v0.4.1.3 — Resonance Field</title><style>
:root{--bg:#080c10;--p:#10171e;--p2:#0b1117;--line:#293541;--text:#edf2f5;--muted:#91a0ad;--gold:#d8be73;--cyan:#70b8ba;--violet:#ac96d0}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font:13px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}header{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:#0c1218}h1{font-size:17px;margin:0}.sub{font:9px ui-monospace,monospace;color:var(--gold)}nav{display:flex;gap:6px}button{background:var(--p2);color:#c7d0d7;border:1px solid var(--line);border-radius:6px;padding:7px 9px;cursor:pointer}button.active{background:var(--gold);color:#111;border-color:var(--gold)}#workspace{height:calc(100% - 58px)}.mode{display:none;width:100%;height:100%}.mode.active{display:block}#observatory{width:100%;height:100%;border:0}.resWrap{height:100%;overflow:auto;padding:14px;max-width:1500px;margin:auto}.call,.panel{background:var(--p);border:1px solid var(--line);border-radius:9px;padding:11px;margin-bottom:11px}.call{border-left:3px solid var(--gold);font-size:10.5px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.summary div{background:var(--p2);border:1px solid var(--line);border-radius:8px;padding:8px}.summary b{display:block;color:var(--gold);font-size:16px}.summary span{font-size:9px;color:var(--muted)}.houseBtns{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}.lattice{display:grid;grid-template-columns:110px repeat(3,1fr);gap:5px}.cell,.axis{border:1px solid var(--line);border-radius:7px;background:var(--p2);padding:9px;min-height:68px}.axis{color:var(--muted);font-size:9px;display:flex;align-items:center;justify-content:center}.cell b{display:block}.cell.actual{outline:2px solid var(--gold)}.cell.natural{box-shadow:inset 0 0 0 2px var(--cyan)}.cell.both{outline:2px solid var(--gold);box-shadow:inset 0 0 0 2px var(--cyan)}.tag{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:1px 5px;font-size:8px;color:var(--muted);margin:4px 3px 0 0}.flow{font-size:16px;padding:10px;background:var(--p2);border:1px solid var(--line);border-radius:8px}.arrow{color:var(--gold);padding:0 8px}.fact{display:grid;grid-template-columns:150px 1fr;gap:8px;border-top:1px solid #25313b;padding:6px 0;font-size:10.5px}.k{color:var(--muted)}table{width:100%;border-collapse:collapse;font-size:10px}th,td{border:1px solid #25313b;padding:6px;text-align:left}th{color:var(--muted);background:var(--p2)}@media(max-width:900px){header{height:auto;align-items:flex-start;gap:8px;flex-direction:column}#workspace{height:calc(100% - 100px)}.grid2,.summary{grid-template-columns:1fr}.lattice{grid-template-columns:70px repeat(3,1fr)}}
</style></head><body><header><div><h1>Noetic Atlas <span style="color:var(--gold)">v0.4.1.3</span></h1><div class="sub">COORDINATED REPRESENTATIONS · STRUCTURE + RESONANCE</div></div><nav><button class="active" data-mode="structure">Structure & Analysis</button><button data-mode="resonance">Resonance Field</button></nav></header><div id="workspace"><section id="structure" class="mode active"><iframe id="observatory" src="./v0412c.html?build=v0413-preserved-observatory" title="Noetic Atlas v0.4.1.2 preserved observatory"></iframe></section><section id="resonance" class="mode"><div class="resWrap"><div id="state" class="call"><b>Waiting for chart state…</b><br>The existing v0412c observatory is preserved unchanged. This view reads the same serialized chart state and adds a second representation on top of it.</div><div id="content"></div></div></section></div><script type="module">
import {buildHouseResonanceMap} from '../src/interpretation/house-resonance-engine.mjs';
const obs=document.getElementById('observatory'),state=document.getElementById('state'),content=document.getElementById('content');let analysis=null,res=null,selectedHouse=1,watcher=null,last='';const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.mode').forEach(x=>x.classList.toggle('active',x.id===b.dataset.mode));if(b.dataset.mode==='resonance')sync()});
function getJsonNode(){try{const outer=obs.contentDocument,core=outer?.getElementById('core');return core?.contentDocument?.getElementById('json')||null}catch{return null}}
function sync(){try{const node=getJsonNode(),raw=node?.textContent?.trim();if(!raw?.startsWith('{'))return false;if(raw===last&&res)return true;last=raw;analysis=JSON.parse(raw);res=buildHouseResonanceMap(analysis);state.innerHTML=`<b>Resonance synchronized.</b><br>This is an additive interpretation of the same Whole Sign chart state used by the preserved observatory. Natural-house correspondence is explicitly modern/optional; actual sign, house, ruler, condition, aspects, graphs, and provenance remain authoritative in their own layers.`;render();return true}catch(e){state.innerHTML=`<b>Resonance could not initialize.</b><br>${esc(e.message)}`;return false}}
function attach(){let tries=0;const t=setInterval(()=>{tries++;const n=getJsonNode();if(n){clearInterval(t);watcher?.disconnect();watcher=new MutationObserver(sync);watcher.observe(n,{childList:true,characterData:true,subtree:true});sync()}else if(tries>40){clearInterval(t);state.innerHTML='<b>No chart state found.</b><br>Return to Structure & Analysis and load or calculate a chart.'}},150)}
obs.addEventListener('load',attach);
function lattice(h){const rows=['Fire','Earth','Air','Water'],cols=['Cardinal','Fixed','Mutable'];let html='<div class="lattice"><div class="axis">Element / Mode</div>'+cols.map(c=>`<div class="axis">${c}</div>`).join('');for(const r of rows){html+=`<div class="axis">${r}</div>`;for(const c of cols){const cell=res.lattice.cells.find(x=>x.element===r&&x.mode===c);const nat=cell.sign===h.natural.sign,act=cell.sign===h.actual.sign,cl=nat&&act?'both':nat?'natural':act?'actual':'';html+=`<div class="cell ${cl}"><b>${cell.sign}</b><span>${c} ${r}</span>${nat?'<span class="tag">natural-house resonance</span>':''}${act?'<span class="tag">actual house sign</span>':''}</div>`}}return html+'</div>'}
function rulerText(x){return x?.sign?`${x.id} in ${x.sign}, ${x.house}H`:x?.id||'—'}
function render(){if(!res)return;const h=res.houses[selectedHouse-1];content.innerHTML=`<div class="summary"><div><b>${res.ascendant_sign}</b><span>Ascendant sign</span></div><div><b>+${res.rotation.sign_steps} signs</b><span>${res.rotation.degrees}° Whole-Sign phase rotation</span></div><div><b>${res.rotation.element_preserved_count}/12</b><span>elemental medium preserved</span></div><div><b>${res.rotation.mode_preserved_count}/12</b><span>modal position preserved</span></div></div><div class="panel"><h2>Ascensional Phase Map</h2><p>The modern natural-house zodiac and the actual Whole Sign zodiac are treated as two separate symbolic layers. With ${esc(res.ascendant_sign)} rising, the actual house zodiac is a constant +${res.rotation.sign_steps}-sign (${res.rotation.degrees}°) rotation of the natural-house sequence. For this chart the global signature is <b>${esc(res.rotation.phase_character)}</b>.</p><div class="houseBtns">${res.houses.map(x=>`<button data-house="${x.house}" class="${x.house===selectedHouse?'active':''}">${x.house}H</button>`).join('')}</div><div class="flow"><b>${h.house_label} house</b><span class="arrow">→</span>${h.natural.sign} · ${h.natural.mode} ${h.natural.element}<span class="arrow">→</span><b>${h.actual.sign} · ${h.actual.mode} ${h.actual.element}</b></div></div><div class="grid2"><div class="panel"><h2>Element–Mode Resonance Lattice</h2>${lattice(h)}<p style="font-size:10px;color:var(--muted)">Cyan inset = natural-house resonance. Gold outline = actual Whole Sign. They are compared, never collapsed.</p></div><div class="panel"><h2>${h.house_label} House Resonance</h2><p>${esc(h.interpretation)}</p><div class="fact"><span class="k">Actual house ruler</span><span>${esc(h.actual.ruler)} → ${esc(rulerText(h.actual_ruler_context))}</span></div><div class="fact"><span class="k">Natural resonance ruler</span><span>${esc(h.natural.ruler)}${h.natural.modern_coruler?` (+ ${esc(h.natural.modern_coruler)} modern co-ruler)`:''} → ${esc(rulerText(h.natural_ruler_context))}</span></div><div class="fact"><span class="k">Element relation</span><span>${esc(h.natural.element)} → ${esc(h.actual.element)} · ${esc(h.element_relation)}</span></div><div class="fact"><span class="k">Mode relation</span><span>${esc(h.natural.mode)} → ${esc(h.actual.mode)} · ${esc(h.mode_relation)}</span></div><div class="fact"><span class="k">Occupants</span><span>${h.occupants.length?h.occupants.map(o=>esc(o.id)).join(', '):'none'}</span></div><div class="call" style="margin-top:9px"><b>Read this in order:</b><br>house domain → actual sign field → actual ruler and its placement → aspects/condition/topology in Structure & Analysis. The natural-house resonance is a secondary phenomenological lens, not a substitute for those facts.</div></div></div><div class="panel"><h2>All Twelve House Phase Mappings</h2><table><thead><tr><th>House</th><th>Natural resonance</th><th>Actual Whole Sign</th><th>Element</th><th>Mode</th><th>Actual ruler</th><th>Occupants</th></tr></thead><tbody>${res.houses.map(x=>`<tr><td>${x.house}H</td><td>${x.natural.sign} · ${x.natural.mode} ${x.natural.element}</td><td>${x.actual.sign} · ${x.actual.mode} ${x.actual.element}</td><td>${x.element_relation}</td><td>${x.natural.mode} → ${x.actual.mode}</td><td>${x.actual.ruler}</td><td>${x.occupants.map(o=>o.id).join(', ')||'—'}</td></tr>`).join('')}</tbody></table></div><div class="call"><b>Epistemic boundary.</b><br>${esc(res.applicability.natural_house_overlay)} ${esc(res.applicability.energy_language)}</div>`;content.querySelectorAll('[data-house]').forEach(b=>b.onclick=()=>{selectedHouse=Number(b.dataset.house);render()})}
attach();
</script></body></html>
