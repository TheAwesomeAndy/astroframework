<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Noetic Atlas v0.4.5 — Research Regimes</title><style>

</style></head><body data-aperture="personal"><header><div><h1>Noetic Atlas <span class="build">v0.4.5</span></h1><div class="sub">ONE CHART STATE · AUDITABLE READING · OPERATIONAL / EXPERIMENTAL / DISCOVERY</div></div><nav><button class="active" data-view="chart">Chart</button><button data-view="reading">Reading</button><button data-view="resonance">Resonance</button><button data-view="network">Network</button><button data-view="houseflow">House Flow</button><button data-view="condition">Condition</button><button data-view="proof">Proof</button></nav><div class="aperture"><button class="active" data-aperture="personal">Personal</button><button data-aperture="research">Research</button></div></header><div id="workspace"><section id="chart" class="view active"><iframe id="core" src="./index.html?build=v045-core" title="Noetic Atlas deterministic chart core"></iframe></section><section id="reading" class="view"><div class="scroll"><div id="readingState" class="call">Loading auditable reading…</div><div id="readingContent"></div></div></section><section id="resonance" class="view"><div class="scroll"><div id="resState" class="call">Loading resonance…</div><div id="resContent"></div></div></section><section id="network" class="view"><div class="scroll"><div id="networkState" class="call">Loading network…</div><div id="networkContent"></div></div></section><section id="houseflow" class="view"><div class="scroll"><div id="riverState" class="call">Loading house flow…</div><div id="riverContent"></div></div></section><section id="condition" class="view"><div class="scroll"><div id="conditionState" class="call">Loading condition…</div><div id="conditionContent"></div></div></section><section id="proof" class="view"><div class="scroll"><div id="proofState" class="call">Select a proof-bearing sentence or fact.</div><div id="proofContent"></div></div></section></div>
<script type="module">

const core=document.getElementById('core'),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let analysis,conditions,graph,energy,resonance,modern,extended,river,discoveries,pack,reading,readingIntegrity,index,lab,last='',observer,selectedRef=null,selectedPlanet='Sun',selectedHouse=1,aspectMode='major';
function setView(id){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===id));document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===id));sync()}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));document.querySelectorAll('[data-aperture]').forEach(b=>b.onclick=()=>{document.body.dataset.aperture=b.dataset.aperture;document.querySelectorAll('[data-aperture]').forEach(x=>x.classList.toggle('active',x===b));renderAll()});function getJson(){try{return core.contentDocument?.getElementById('json')}catch{return null}}function canonical(){try{const d=core.contentDocument;if(!d?.getElementById('json')?.textContent?.trim()?.startsWith('{'))d?.getElementById('sample')?.click()}catch{}}
function sync(){try{const raw=getJson()?.textContent?.trim();if(!raw?.startsWith('{'))return false;if(raw===last&&analysis)return true;last=raw;analysis=JSON.parse(raw);conditions=computeConditionSystem(analysis);graph=analyzeGraphArchitecture(analysis,conditions.primitive);energy=buildEnergeticSynthesis(analysis,graph,conditions.primitive);resonance=buildHouseResonanceMap(analysis);modern=buildModernRulershipOverlay(analysis);extended=computeExtendedAspects(analysis);river=buildHouseRiver(analysis);discoveries=buildV044DiscoverySuite({analysis,conditions,graph,resonance,river,modern,extended});lab=buildResearchLab({analysis,graph,river,conditions,modern,extended,discoveries});pack=buildEvidencePack({analysis,conditions,graph,resonance,river,energy,discoveries});const extras=[...discoveries.derivation_entries,...modern.ledger_entries,...extended.ledger_entries];const baseIndex=buildDerivationIndexV044({analysis,primitive:conditions.primitive,relational:conditions.relational,compound:conditions.compound,houseRiver:river,extra:extras});reading=normalizeReadingClaimProof(buildAuditableReading(pack));readingIntegrity=checkReadingIntegrity(reading,pack,baseIndex);index=buildDerivationIndexV044({analysis,primitive:conditions.primitive,relational:conditions.relational,compound:conditions.compound,houseRiver:river,extra:[...extras,...reading.derivation_entries]});renderAll();return true}catch(e){for(const id of ['readingState','resState','networkState','riverState','conditionState'])document.getElementById(id).innerHTML=`<b>Initialization failed.</b><br>${esc(e.message)}`;return false}}
function attach(){canonical();let n=0;const t=setInterval(()=>{n++;canonical();const j=getJson();if(j){observer?.disconnect();observer=new MutationObserver(sync);observer.observe(j,{childList:true,characterData:true,subtree:true});if(sync())clearInterval(t)}if(n>60)clearInterval(t)},150)}core.addEventListener('load',attach);attach();
const regimeBadge=r=>`<span class="tag ${r==='operational'?'op':r==='experimental'?'exp':'disc'}">${esc(r)}</span>`;function claimHTML(c){const tag=c.status==='verified'?'verified':c.status==='interpretive'?'interpretive':c.status==='blocked'?'blocked':'discovery';return `<article class="claim"><span class="tag ${tag}">${esc(c.status)}</span><span class="tag">${esc(c.epistemic_layer)}</span><p>${esc(c.text)}</p><button data-claim-proof="${esc(c.derivation_ref)}">Why?</button></article>`}
function renderReading(){if(!readingIntegrity)return;const m=readingIntegrity.metrics,groups=['architecture','placements','condition','discoveries','phenomenology'];document.getElementById('readingState').className=`call ${readingIntegrity.publication_gate.pass?'ok':'error'}`;document.getElementById('readingState').innerHTML=`<b>${readingIntegrity.publication_gate.pass?'Reading passed integrity gate.':'Reading contains blocked claims.'}</b><br>Personal Reading consumes the Operational Evidence Pack. Research hypotheses remain outside it unless explicitly inspected in Research aperture.`;document.getElementById('readingContent').innerHTML=`<div class="summary"><div><b>${Math.round(m.structural_provenance_coverage*100)}%</b><span>structural provenance</span></div><div><b>${Math.round(m.interpretive_evidence_coverage*100)}%</b><span>interpretive evidence</span></div><div><b>${m.blocked_claim_count}</b><span>blocked claims</span></div><div><b>${discoveries.findings.length}</b><span>proof-bearing discoveries</span></div></div><div class="call"><b>Integrity rule.</b><br>Structural mismatch or unresolved proof blocks publication of that sentence. Multi-basin charts retain every terminal basin. Natural-house and modern-rulership comparisons stay secondary; mixed compound testimony cannot be flattened into one strong/weak label.</div><div class="researchOnly call">${regimeBadge('experimental')} <b>Research context is visible, not merged into the Reading.</b><br>${lab.hypotheses.length} registered hypothesis packs and ${lab.discovery.count} discovery candidates are available for inspection with model identity attached.</div>${groups.map(g=>{const rows=readingIntegrity.approved_claims.filter(c=>c.section===g);return rows.length?`<div class="panel"><h2>${g[0].toUpperCase()+g.slice(1)}</h2>${rows.map(claimHTML).join('')}</div>`:''}).join('')}${readingIntegrity.blocked_claims.length?`<div class="panel"><h2>Blocked claims</h2>${readingIntegrity.blocked_claims.map(claimHTML).join('')}</div>`:''}`;wireProof(document.getElementById('readingContent'))}
function signature(p){return renderConditionSignatureHTML(conditions?.signatures?.[p]||null)}function renderResonance(){if(!resonance||!modern)return;const h=resonance.houses[selectedHouse-1],r=h.actual_ruler_context,mh=modern.houses[selectedHouse-1],mo=modern.placements.find(x=>x.id===mh.modern_outer_ruler);document.getElementById('resState').innerHTML='<b>Resonance synchronized.</b><br>Actual Whole Sign and traditional ruler remain primary; modern outer rulership is an explicitly separate model overlay.';document.getElementById('resContent').innerHTML=`<div class="summary"><div><b>${resonance.ascendant_sign}</b><span>Ascendant</span></div><div><b>${resonance.rotation.degrees}°</b><span>phase rotation</span></div><div><b>${resonance.rotation.element_preserved_count}/12</b><span>element preserved</span></div><div><b>${resonance.rotation.mode_preserved_count}/12</b><span>mode preserved</span></div></div><div class="toolbar">${resonance.houses.map(x=>`<button data-house="${x.house}" class="${x.house===selectedHouse?'active':''}">${x.house}H</button>`).join('')}</div><div class="panel"><h2>${h.house_label} house · ${h.natural.sign} → ${h.actual.sign}</h2><div class="fact"><span class="muted">Traditional actual ruler</span><span>${h.actual.ruler}${r?.sign?` in ${r.sign} ${r.house}H`:''}${signature(h.actual.ruler)}</span></div><div class="fact"><span class="muted">Modern model overlay</span><span>${mh.modern_outer_ruler?`${mh.sign}: ${mh.traditional_ruler} + ${mh.modern_outer_ruler} co-rulership comparison${mo?.modern_domicile?' · modern outer ruler is in its modern domicile':''}`:'No outer-planet co-ruler assigned for this sign.'}</span></div><div class="fact"><span class="muted">Element</span><span>${h.natural.element} → ${h.actual.element}</span></div><div class="fact"><span class="muted">Mode</span><span>${h.natural.mode} → ${h.actual.mode}</span></div><div class="call"><b>Model boundary.</b><br>The modern overlay never rewrites traditional dispositor edges.</div></div><div class="researchOnly panel">${regimeBadge('experimental')} <b>Model comparison.</b><br>${lab.comparisons.filter(x=>x.hypothesis_id?.includes('MODERN')).map(x=>`${esc(x.hypothesis_id)}: ${esc(x.changed_fields.join(', ')||'no structural delta')}`).join('<br>')||'No active modern-rulership delta.'}</div>`;document.querySelectorAll('[data-house]').forEach(b=>b.onclick=()=>{selectedHouse=Number(b.dataset.house);renderResonance()});wireProof(document.getElementById('resContent'))}
function renderNetwork(){if(!graph||!discoveries||!extended)return;const imported=(analysis.objects||[]).filter(o=>['node','minor_body','derived'].includes(o.type));document.getElementById('networkState').innerHTML=`<b>Network synchronized.</b><br>Canonical graph = major aspects + traditional dispositorship. Expanded aspect families remain optional experimental projections.`;const major=`<div class="grid2"><div class="panel"><h2>Cross-layer discoveries</h2>${discoveries.findings.map(f=>`<div class="finding"><span class="tag discovery">detected-no-null-model</span><b>${esc(f.title)}</b><p>${esc(f.statement)}</p><button data-proof="${esc(f.derivation_ref)}">Why?</button></div>`).join('')}</div><div class="panel"><h2>Relational condition</h2>${conditions.relational.relations.map(r=>`<div class="testimony"><b>${esc(r.type)}</b> · ${esc(r.from||r.a)} ${r.to?`→ ${esc(r.to)}`:`↔ ${esc(r.b)}`}<div class="muted">${esc(r.rule_id)}</div><button data-proof="${esc(r.derivation_ref)}">Why?</button></div>`).join('')}</div></div>`;const ext=`<div class="panel"><h2>Expanded aspect family</h2><div class="call">Supplemental only. Every result carries the selected orb policy and does not alter the canonical graph.</div>${extended.aspects.map(a=>`<div class="fact"><span><b>${esc(a.a)}</b> ${esc(a.label)} <b>${esc(a.b)}</b></span><span>orb ${a.orb_deg.toFixed(2)}° · ${esc(a.phase)} <button data-proof="${esc(a.derivation_ref)}">Why?</button></span></div>`).join('')||'<span class="muted">No supplemental aspects within the selected policy.</span>'}</div>`;const research=`<div class="researchOnly panel"><h2>Research model deltas</h2>${lab.comparisons.map(c=>`<div class="finding">${regimeBadge('experimental')} <b>${esc(c.hypothesis_id)}</b><p>${c.changed_fields.length?`Changed fields: ${c.changed_fields.map(esc).join(', ')}`:'No structural delta detected.'}</p><div class="muted">A delta is not evidence that the experimental model is superior.</div></div>`).join('')}<h2>Discovery candidates</h2>${lab.discovery.candidates.slice(0,30).map(c=>`<div class="finding">${regimeBadge('discovery')} <b>${esc(c.candidate_id)}</b><p>${esc(c.description)}</p><div class="muted">${esc(c.promotion_state)} · null comparison ${esc(c.model_identity.status.null_comparison)}</div></div>`).join('')}</div>`;document.getElementById('networkContent').innerHTML=`<div class="summary"><div><b>${conditions.relational.relations.length}</b><span>typed relations</span></div><div><b>${graph.findings.length}</b><span>graph findings</span></div><div><b>${discoveries.findings.length}</b><span>cross-layer discoveries</span></div><div><b>${extended.aspects.length}</b><span>supplemental aspects</span></div></div><div class="toolbar"><button data-aspect-mode="major" class="${aspectMode==='major'?'active':''}">Canonical major graph</button><button data-aspect-mode="extended" class="${aspectMode==='extended'?'active':''}">+ expanded aspect family</button></div>${imported.length?`<div class="call"><b>Imported extended objects:</b> ${imported.map(o=>esc(o.id)).join(', ')}. Supplied coordinates are usable in geometry; this does not mean the astronomy adapter computed them.</div>`:''}${aspectMode==='extended'?ext:major}${research}`;document.querySelectorAll('[data-aspect-mode]').forEach(b=>b.onclick=()=>{aspectMode=b.dataset.aspectMode;renderNetwork()});wireProof(document.getElementById('networkContent'))}
function renderRiver(){if(!river)return;document.getElementById('riverState').innerHTML='<b>House Flow synchronized.</b><br>Route width remains an integer count of house-ruler paths, never a strength score. Entry-ruler condition is shown inline.';document.getElementById('riverContent').innerHTML=`<div class="summary"><div><b>12</b><span>house domains</span></div><div><b>${river.planetary_bands.length}</b><span>shared routing edges</span></div><div><b>${river.max_route_count}</b><span>max route count</span></div><div><b>${river.derivation_entries.length}</b><span>river proof objects</span></div></div><div class="panel"><table><thead><tr><th>House</th><th>Domain</th><th>Entry ruler + condition</th><th>Route</th></tr></thead><tbody>${river.houses.map(h=>`<tr><td>${h.house}H</td><td>${esc(h.topic)}</td><td>${esc(h.entry_ruler)}${signature(h.entry_ruler)}</td><td>${esc((h.route||[]).join(' → '))}</td></tr>`).join('')}</tbody></table></div><div class="panel"><h2>Shared route bands</h2>${river.planetary_bands.map(b=>`<div class="fact"><span>${esc(b.from)} → ${esc(b.to)}</span><span>${b.count} routes · ${(b.houses||[]).map(h=>`${h}H`).join(', ')} <button data-proof="${esc(b.derivation_ref)}">Why?</button></span></div>`).join('')}</div><div class="researchOnly call">${regimeBadge('experimental')} Alternate routing hypotheses must produce separate House River snapshots. Registered-but-unexecuted models are not allowed to fabricate routes.</div>`;wireProof(document.getElementById('riverContent'))}
function renderCondition(){if(!conditions)return;const p=selectedPlanet,comp=conditions.compound.by_planet[p];document.getElementById('conditionState').innerHTML='<b>Condition synchronized.</b><br>Primitive, relational, and compound testimonies remain categorical and independently inspectable.';document.getElementById('conditionContent').innerHTML=`<div class="toolbar">${CLASSICAL_PLANETS.map(x=>`<button data-planet="${x}" class="${x===p?'active':''}">${x}</button>`).join('')}</div><div class="panel"><h2>${p}</h2>${signature(p)}</div><div class="grid2"><div class="panel"><h2>Bonification</h2>${(comp?.bonifications_received||[]).map(t=>`<div class="testimony"><b>${(t.agents||[]).join(' + ')}</b> → ${p}<div class="muted">${esc(t.mechanism)}</div><button data-proof="${esc(t.derivation_ref)}">Why?</button></div>`).join('')||'<span class="muted">none</span>'}</div><div class="panel"><h2>Maltreatment</h2>${(comp?.maltreatments_received||[]).map(t=>`<div class="testimony"><b>${(t.agents||[]).join(' + ')}</b> → ${p}<div class="muted">${esc(t.mechanism)}</div><button data-proof="${esc(t.derivation_ref)}">Why?</button></div>`).join('')||'<span class="muted">none</span>'}</div></div><div class="researchOnly call">${regimeBadge('experimental')} No experimental hypothesis currently rewrites Operational condition. Future condition models require independent model identity and comparison snapshots.</div>`;document.querySelectorAll('[data-planet]').forEach(b=>b.onclick=()=>{selectedPlanet=b.dataset.planet;renderCondition()});wireProof(document.getElementById('conditionContent'))}
function renderWalk(n){if(!n)return'';return `<div class="walkNode"><b>${esc(n.label||n.id)}</b><div class="muted">${esc(n.status)}${n.rule_id?` · ${esc(n.rule_id)}`:''}</div>${n.source_reference?`<div class="proof">${esc(n.source_reference)}</div>`:''}${n.children?.length?`<div class="walkChildren">${n.children.map(renderWalk).join('')}</div>`:''}</div>`}function renderProof(){if(!index||!lab)return;const fallback=readingIntegrity?.approved_claims?.[0]?.derivation_ref,ref=selectedRef||fallback,tree=ref?walkDerivationV044(ref,index):null,m=readingIntegrity?.metrics||{};document.getElementById('proofState').innerHTML=`<b>Proof synchronized.</b><br>${index.count} indexed objects; Reading claims and model-overlay discoveries are first-class proof nodes.`;document.getElementById('proofContent').innerHTML=`<div class="summary"><div><b>${Math.round((m.structural_provenance_coverage||0)*100)}%</b><span>structural provenance</span></div><div><b>${Math.round((m.interpretive_evidence_coverage||0)*100)}%</b><span>interpretive evidence</span></div><div><b>${m.blocked_claim_count||0}</b><span>blocked claims</span></div><div><b>${m.contradiction_flag_count||0}</b><span>contradiction flags</span></div></div><div class="panel"><h2>Derivation Walker</h2>${tree?renderWalk(tree):'<span class="muted">Select a claim.</span>'}</div><div class="researchOnly panel"><h2>Research constitution</h2><div class="call"><b>${lab.audit.pass?'Regime contamination audit passed.':'Regime contamination audit failed.'}</b><br>Experimental models may produce deltas from Operational state but may not silently mutate it.</div><div class="grid3">${Object.entries(lab.regimes).map(([k,v])=>`<div class="panel">${regimeBadge(k)}<h3>${esc(k)}</h3><p>${esc(v.purpose)}</p><div class="muted">${esc(v.contamination_rule)}</div></div>`).join('')}</div><h2>Hypothesis registry</h2><table><tr><th>ID</th><th>Domain</th><th>Status</th><th>Question</th></tr>${lab.hypotheses.map(h=>`<tr><td><code>${esc(h.hypothesis_id)}</code></td><td>${esc(h.domain)}</td><td>${esc(h.execution_status)}</td><td>${esc(h.question)}</td></tr>`).join('')}</table><h2>Lifecycle</h2><p>${lab.lifecycle.join(' → ')}</p></div>`}
function openProof(ref){selectedRef=ref;setView('proof');renderProof()}function wireProof(root=document){root.querySelectorAll?.('[data-proof],[data-claim-proof]').forEach(b=>b.onclick=()=>openProof(b.dataset.proof||b.dataset.claimProof));root.querySelectorAll?.('[data-derivation]').forEach(x=>{if(x.dataset.derivation)x.onclick=()=>openProof(x.dataset.derivation)})}function renderAll(){renderReading();renderResonance();renderNetwork();renderRiver();renderCondition();renderProof()}
