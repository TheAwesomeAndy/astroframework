<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Noetic Atlas</title>
<style>
:root{--bg:#080c10;--panel:#10171e;--panel2:#0b1117;--line:#293541;--text:#edf2f5;--muted:#91a0ad;--gold:#d8be73;--green:#83c39b;--red:#d89292;--violet:#ac96d0;--cyan:#70b8ba;--blue:#82b2d7}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:13px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}
header{height:62px;display:flex;align-items:center;gap:18px;padding:8px 14px;background:#0c1218;border-bottom:1px solid var(--line)}
.brand{min-width:max-content}.brand h1{margin:0;font-size:18px}.brand small{display:block;color:var(--muted);font:9px ui-monospace,monospace;letter-spacing:.05em}.build{color:var(--gold);margin-left:6px;font-size:9px;font-weight:500}
nav{display:flex;gap:5px;overflow-x:auto;scrollbar-width:thin;flex:1;padding-bottom:2px}button{background:var(--panel2);color:#c7d0d7;border:1px solid var(--line);border-radius:6px;padding:7px 9px;cursor:pointer;white-space:nowrap}button:hover{border-color:#667785}button.active{background:var(--gold);color:#111;border-color:var(--gold)}
#workspace{height:calc(100% - 62px)}.view{display:none;width:100%;height:100%}.view.active{display:block}#core{width:100%;height:100%;border:0;background:#0a0e12}.scroll{height:100%;overflow:auto;padding:14px;max-width:1500px;margin:auto}
.call,.panel,.card,.relationCard,.testimony{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:11px;margin-bottom:11px}.call{border-left:3px solid var(--gold);font-size:10.5px}.call.success{border-left-color:var(--green)}.call.error{border-left-color:var(--red)}
h2{font-size:15px;margin:0 0 8px}h3{font-size:12px;margin:10px 0 5px}.muted,.k{color:var(--muted)}.muted{font-size:9px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:11px}.summary div{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px}.summary b{display:block;color:var(--gold);font-size:16px}.summary span{font-size:9px;color:var(--muted)}
.toolbar,.houseBtns,.planetBtns,.filters{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0 11px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}.cards,.relationGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:9px}.card,.relationCard{background:var(--panel2)}
.fact{display:grid;grid-template-columns:150px 1fr;gap:8px;padding:6px 0;border-top:1px solid #25313b;font-size:10.5px}.tag{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:1px 6px;font-size:8px;color:var(--muted);margin:0 4px 3px 0}.tag.energy,.tag.exc{border-color:var(--gold);color:var(--gold)}.tag.rec{border-color:var(--cyan);color:var(--cyan)}.tag.ovr,.tag.mal{border-color:var(--red);color:var(--red)}.tag.bon{border-color:var(--green);color:var(--green)}.tag.mix{border-color:var(--violet);color:var(--violet)}
.section{border-top:1px solid #24303a;padding:8px 0}.section:first-child{border-top:0}.section h3{font-size:9px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 4px}.section p{font-size:10.5px;margin:0}.life,.soul{padding:9px;margin:8px 0;background:#111820;font-size:10.5px}.life{border-left:3px solid var(--gold)}.soul{border-left:3px solid var(--violet)}.practice{font-size:10px;margin:5px 0 0 19px;padding:0}
.condSig{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}.condToken{border:1px solid #43505c;border-radius:99px;padding:2px 6px;font-size:8px;background:#0a1016}.condToken b{color:var(--muted);font-weight:600}.proof,.relationCard code{font:9px/1.45 ui-monospace,monospace;white-space:pre-wrap;word-break:break-word}.proofBtn{margin-top:7px}.walkNode{margin:6px 0;padding:8px;border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:7px;background:var(--panel2)}.walkChildren{margin-left:22px}
.lattice{display:grid;grid-template-columns:90px repeat(3,1fr);gap:5px}.cell,.axis{border:1px solid var(--line);border-radius:7px;background:var(--panel2);padding:9px;min-height:62px}.axis{color:var(--muted);font-size:9px;display:flex;align-items:center;justify-content:center}.cell.actual{outline:2px solid var(--gold)}.cell.natural{box-shadow:inset 0 0 0 2px var(--cyan)}.cell.both{outline:2px solid var(--gold);box-shadow:inset 0 0 0 2px var(--cyan)}
svg{width:100%;min-height:600px;background:#0a1016;border:1px solid #202a34;border-radius:9px}.riverTable{width:100%;border-collapse:collapse;font-size:10px}.riverTable th,.riverTable td{border:1px solid #25313b;padding:5px;text-align:left}.riverTable th{color:var(--muted);background:var(--panel2)}details summary{cursor:pointer;color:#bac5ce}
@media(max-width:950px){header{height:96px;display:block;padding:8px 10px}.brand{height:34px}nav{height:45px}.brand small{display:none}#workspace{height:calc(100% - 96px)}.grid2,.summary{grid-template-columns:1fr}.lattice{grid-template-columns:66px repeat(3,1fr)}.scroll{padding:10px}.fact{grid-template-columns:110px 1fr}}
</style>
</head>
<body>
<header>
  <div class="brand"><h1>Noetic Atlas <span class="build">current</span></h1><small>ONE CHART STATE · MANY COORDINATED VIEWS</small></div>
  <nav aria-label="Noetic Atlas views">
    <button class="active" data-view="chart">Chart</button>
    <button data-view="reading">Reading</button>
    <button data-view="resonance">Resonance</button>
    <button data-view="network">Network</button>
    <button data-view="houseflow">House Flow</button>
    <button data-view="condition">Condition</button>
    <button data-view="proof">Proof</button>
  </nav>
</header>
<div id="workspace">
  <section id="chart" class="view active"><iframe id="core" src="./index.html?build=unified-app-core" title="Noetic Atlas chart workspace"></iframe></section>
  <section id="reading" class="view"><div class="scroll"><div id="readingState" class="call">Loading chart analysis…</div><div id="readingContent"></div></div></section>
  <section id="resonance" class="view"><div class="scroll"><div id="resState" class="call">Loading resonance field…</div><div id="resContent"></div></div></section>
  <section id="network" class="view"><div class="scroll"><div id="networkState" class="call">Loading graph architecture…</div><div id="networkContent"></div></div></section>
  <section id="houseflow" class="view"><div class="scroll"><div id="riverState" class="call">Loading house routing…</div><div id="riverContent"></div></div></section>
  <section id="condition" class="view"><div class="scroll"><div id="conditionState" class="call">Loading condition state…</div><div id="conditionContent"></div></div></section>
  <section id="proof" class="view"><div class="scroll"><div id="proofState" class="call">Select any “Why?” control in the app, or inspect the current proof index below.</div><div id="proofContent"></div></div></section>
</div>
<script type="module">
import {CLASSICAL_PLANETS} from '../src/conditions/primitive-condition-engine.mjs';
import {computeConditionSystem} from '../src/conditions/condition-system.mjs';
import {renderConditionSignatureHTML} from '../src/conditions/condition-signature.mjs';
import {analyzeGraphArchitecture} from '../src/research/graph-analytics-engine.mjs';
import {buildEnergeticSynthesis} from '../src/interpretation/energetic-synthesis-display.mjs';
import {buildHouseResonanceMap} from '../src/interpretation/house-resonance-engine.mjs';
import {buildHouseRiver} from '../src/research/house-river-engine.mjs';
import {buildDerivationIndex,walkDerivation} from '../src/integrity/derivation-walker.mjs';

const NS='http://www.w3.org/2000/svg';
const core=document.getElementById('core');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pretty=x=>JSON.stringify(x,null,2);
let analysis=null,conditions=null,graph=null,energy=null,resonance=null,river=null,index=null,lastRaw='',observer=null;
let readingFilter='featured',selectedHouse=1,selectedPlanet='Sun',selectedRef=null;

function setView(id){
  document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===id));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===id));
  sync();
}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));

function cleanCoreBrand(){
  try{
    const d=core.contentDocument;
    if(!d)return;
    d.title='Noetic Atlas — Chart';
    const small=d.querySelector('.brand h1 small'); if(small)small.textContent='CHART';
    const tagline=d.querySelector('.brand > small'); if(tagline)tagline.textContent='See the structure. Follow the flow. Show the work.';
  }catch{}
}
function getJsonNode(){try{return core.contentDocument?.getElementById('json')||null}catch{return null}}
function loadCanonicalIfNeeded(){
  try{const d=core.contentDocument;const json=d?.getElementById('json')?.textContent?.trim();if(!json?.startsWith('{'))d?.getElementById('sample')?.click()}catch{}
}
function sync(){
  cleanCoreBrand();
  try{
    const n=getJsonNode(),raw=n?.textContent?.trim();
    if(!raw?.startsWith('{'))return false;
    if(raw===lastRaw&&analysis)return true;
    lastRaw=raw;
    analysis=JSON.parse(raw);
    conditions=computeConditionSystem(analysis);
    graph=analyzeGraphArchitecture(analysis,conditions.primitive);
    energy=buildEnergeticSynthesis(analysis,graph,conditions.primitive);
    resonance=buildHouseResonanceMap(analysis);
    river=buildHouseRiver(analysis);
    index=buildDerivationIndex({analysis,primitive:conditions.primitive,relational:conditions.relational,compound:conditions.compound,houseRiver:river});
    renderAll();
    return true;
  }catch(e){
    for(const id of ['readingState','resState','networkState','riverState','conditionState']){
      const box=document.getElementById(id);if(box)box.innerHTML=`<b>View could not initialize.</b><br>${esc(e.message)}`;
    }
    return false;
  }
}
function attachCore(){
  cleanCoreBrand();loadCanonicalIfNeeded();let tries=0;
  const timer=setInterval(()=>{tries++;cleanCoreBrand();loadCanonicalIfNeeded();const n=getJsonNode();if(n){observer?.disconnect();observer=new MutationObserver(sync);observer.observe(n,{childList:true,characterData:true,subtree:true});if(sync())clearInterval(timer)}if(tries>60)clearInterval(timer)},150);
}
core.addEventListener('load',attachCore);attachCore();

function section(name,text){return text?`<div class="section"><h3>${esc(name)}</h3><p>${esc(text)}</p></div>`:''}
function energyCard(a){const s=a.sections||{};return `<article class="card"><span class="tag energy">symbolic energy</span><span class="tag">interpretive inference</span><h2>${esc(a.title)}</h2>${section('Core energy',s.core_energy||s.plain_language)}${section('How the energy moves',s.energetic_synthesis)}${section('House ruler + routing',s.rulership_and_routing)}${section('Aspect modulation',s.aspect_modulation)}${section('Graph context + condition',s.graph_context||s.traditional_condition)}${section('Balanced expression',s.balanced_expression)}${section('Under-expression',s.under_expression)}${section('Over-expression',s.over_expression)}${s.material_expression?`<div class="life"><b>Material / lived expression</b><br>${esc(s.material_expression)}</div>`:''}${s.soul_question?`<div class="soul"><b>Soul / spirit inquiry</b><br>${esc(s.soul_question)}</div>`:''}${s.embodiment_practices?.length?`<div class="section"><h3>Ways to work with it</h3><ol class="practice">${s.embodiment_practices.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div>`:''}<details><summary>Evidence used</summary><div class="proof">${esc(pretty(a.evidence))}</div></details></article>`}
function renderReading(){
  if(!energy)return;
  const list=readingFilter==='graph'?energy.graph_cards||[]:readingFilter==='placements'?energy.placements||[]:readingFilter==='aspects'?energy.aspects||[]:readingFilter==='outer'?energy.outer_planets||[]:energy.featured||[];
  document.getElementById('readingState').innerHTML='<b>Reading synchronized.</b><br>This is downstream interpretation of the same chart state shown in Chart. No separate calculator exists here.';
  document.getElementById('readingContent').innerHTML=`<div class="summary"><div><b>${energy.placements?.length||0}</b><span>placement profiles</span></div><div><b>${energy.graph_cards?.length||0}</b><span>graph structures translated</span></div><div><b>${energy.aspects?.length||0}</b><span>tight aspect currents</span></div><div><b>${energy.outer_planets?.length||0}</b><span>outer-planet profiles</span></div></div><div class="call"><b>Read order:</b> archetypal current → actual sign → actual Whole Sign house → optional natural-house resonance → ruler/dispositor handoff → aspect geometry → topology → traditional condition → lived expression. Energy language is symbolic, not measured physical force.</div><div class="filters">${[['featured','Featured'],['placements','Placements'],['graph','Graph → meaning'],['aspects','Tight aspects'],['outer','Outer planets']].map(([k,l])=>`<button data-reading="${k}" class="${k===readingFilter?'active':''}">${l}</button>`).join('')}</div><div class="cards">${list.map(energyCard).join('')||'<div class="call">No records in this category.</div>'}</div>`;
  document.querySelectorAll('[data-reading]').forEach(b=>b.onclick=()=>{readingFilter=b.dataset.reading;renderReading()});
}

function lattice(h){const rows=['Fire','Earth','Air','Water'],cols=['Cardinal','Fixed','Mutable'];let out='<div class="lattice"><div class="axis">Element / Mode</div>'+cols.map(c=>`<div class="axis">${c}</div>`).join('');for(const r of rows){out+=`<div class="axis">${r}</div>`;for(const c of cols){const cell=resonance.lattice.cells.find(x=>x.element===r&&x.mode===c),nat=cell.sign===h.natural.sign,act=cell.sign===h.actual.sign,cl=nat&&act?'both':nat?'natural':act?'actual':'';out+=`<div class="cell ${cl}"><b>${cell.sign}</b><span class="muted">${c} ${r}</span>${nat?'<span class="tag rec">natural resonance</span>':''}${act?'<span class="tag energy">actual sign</span>':''}</div>`}}return out+'</div>'}
function signature(p){return renderConditionSignatureHTML(conditions?.signatures?.[p]||null)}
function renderResonance(){
  if(!resonance)return;const h=resonance.houses[selectedHouse-1],r=h.actual_ruler_context;
  document.getElementById('resState').innerHTML='<b>Resonance synchronized.</b><br>The natural-house correspondence is a secondary phenomenological comparison. Actual sign, actual house, ruler placement, condition, and routing remain primary.';
  document.getElementById('resContent').innerHTML=`<div class="summary"><div><b>${resonance.ascendant_sign}</b><span>Ascendant</span></div><div><b>+${resonance.rotation.sign_steps}</b><span>sign rotation</span></div><div><b>${resonance.rotation.element_preserved_count}/12</b><span>element preserved</span></div><div><b>${resonance.rotation.mode_preserved_count}/12</b><span>mode preserved</span></div></div><div class="houseBtns">${resonance.houses.map(x=>`<button data-house="${x.house}" class="${x.house===selectedHouse?'active':''}">${x.house}H</button>`).join('')}</div><div class="grid2"><div class="panel"><h2>Element–Mode Resonance</h2>${lattice(h)}<p class="muted">Cyan inset = natural-house resonance. Gold outline = actual Whole Sign.</p></div><div class="panel"><h2>${h.house_label} house · ${h.natural.sign} → ${h.actual.sign}</h2><p>${esc(h.interpretation)}</p><div class="fact"><span class="k">Actual ruler</span><span><b>${esc(h.actual.ruler)}</b>${r?.sign?` in ${esc(r.sign)} ${r.house}H`:''}${signature(h.actual.ruler)}</span></div><div class="fact"><span class="k">Natural resonance</span><span>${esc(h.natural.sign)} / ${esc(h.natural.ruler)}</span></div><div class="fact"><span class="k">Element</span><span>${esc(h.natural.element)} → ${esc(h.actual.element)} · ${esc(h.element_relation)}</span></div><div class="fact"><span class="k">Mode</span><span>${esc(h.natural.mode)} → ${esc(h.actual.mode)} · ${esc(h.mode_relation)}</span></div><h3>Occupants</h3>${h.occupants.length?h.occupants.map(o=>`<div class="fact"><span class="k">${esc(o.id)}</span><span>${esc(o.sign)}${signature(o.id)}</span></div>`).join(''):'<span class="muted">None</span>'}</div></div>`;
  document.querySelectorAll('[data-house]').forEach(b=>b.onclick=()=>{selectedHouse=Number(b.dataset.house);renderResonance()});wireProof(document.getElementById('resContent'));
}

function relLabel(r){return r.type==='reception'?`${r.from} receives ${r.to}`:r.type==='exchange'?`${r.a} ↔ ${r.b} exchange domiciles`:r.type==='mutual_reception'?`${r.a} ↔ ${r.b} mutual reception`:r.type==='domination'?`${r.from} dominates ${r.to}`:`${r.from} overcomes ${r.to}`}
function flowPositions(){const ps=CLASSICAL_PLANETS,cx=550,cy=315,r=230,out={};ps.forEach((p,i)=>{const a=-Math.PI/2+i*2*Math.PI/ps.length;out[p]={x:cx+r*Math.cos(a),y:cy+r*Math.sin(a)}});return out}
function svgLine(svg,p,q,stroke,width=2,dash='',opacity=.85){const l=document.createElementNS(NS,'line');for(const [k,v] of Object.entries({x1:p.x,y1:p.y,x2:q.x,y2:q.y}))l.setAttribute(k,v);l.setAttribute('stroke',stroke);l.setAttribute('stroke-width',width);if(dash)l.setAttribute('stroke-dasharray',dash);l.setAttribute('stroke-opacity',opacity);svg.appendChild(l);return l}
function qualifiedFlowSVG(){const svg=document.createElementNS(NS,'svg');svg.setAttribute('viewBox','0 0 1100 640');const pos=flowPositions();for(const e of analysis.topology.dispositor_graph.edges){if(pos[e.from]&&pos[e.to])svgLine(svg,pos[e.from],pos[e.to],'#718295',2)}for(const e of conditions.relational.graphs.reception.edges)svgLine(svg,pos[e.from],pos[e.to],'#70b8ba',2,'7 5');for(const e of conditions.relational.graphs.exchange.edges)svgLine(svg,pos[e.a],pos[e.b],'#d8be73',3,'2 7');for(const e of conditions.relational.graphs.overcoming.edges)svgLine(svg,pos[e.from],pos[e.to],e.type==='domination'?'#ac96d0':'#d89292',e.type==='domination'?4:2.5);for(const [planet,p] of Object.entries(pos)){const g=document.createElementNS(NS,'g');g.setAttribute('transform',`translate(${p.x},${p.y})`);g.style.cursor='pointer';g.onclick=()=>{selectedPlanet=planet;setView('condition');renderCondition()};const c=document.createElementNS(NS,'circle');c.setAttribute('r','46');c.setAttribute('fill','#121a22');c.setAttribute('stroke','#b9c5cf');g.appendChild(c);const t=document.createElementNS(NS,'text');t.setAttribute('text-anchor','middle');t.setAttribute('fill','#fff');t.setAttribute('font-size','11');t.setAttribute('y','-5');t.textContent=planet;g.appendChild(t);const s=document.createElementNS(NS,'text');s.setAttribute('text-anchor','middle');s.setAttribute('fill','#91a0ad');s.setAttribute('font-size','8');s.setAttribute('y','12');s.textContent=conditions.compound?.by_planet?.[planet]?.presence?.replace('_present','')||'';g.appendChild(s);svg.appendChild(g)}return svg}
function renderNetwork(){
  if(!graph||!conditions)return;const rels=conditions.relational.relations,basin=graph.functional?.terminal_basins?.[0]||graph.dispositor?.terminal_basins?.[0]||null,metrics=graph.metrics||[],findings=graph.findings||[];
  document.getElementById('networkState').innerHTML='<b>Network synchronized.</b><br>Dispositorship, reception, exchange, overcoming, and compound qualification remain distinct. A graph term is never the final interpretation.';
  document.getElementById('networkContent').innerHTML=`<div class="summary"><div><b>${rels.length}</b><span>typed relations</span></div><div><b>${metrics.length}</b><span>graph metrics</span></div><div><b>${findings.length}</b><span>explainable findings</span></div><div><b>${index?.count||0}</b><span>proof objects</span></div></div><div class="panel"><h2>Qualified Flow</h2><div class="muted">Gray = dispositorship · cyan dashed = reception · gold dotted = exchange · red/violet = overcoming/domination. Click a planet to inspect condition.</div><div id="networkSvg"></div></div><div class="grid2"><div class="panel"><h2>Relations</h2><div class="relationGrid">${rels.map(r=>`<article class="relationCard"><span class="tag ${r.type==='reception'?'rec':r.type==='exchange'||r.type==='mutual_reception'?'exc':'ovr'}">${esc(r.type)}</span><h3>${esc(relLabel(r))}</h3><div class="muted">${esc(r.rule_id)}</div><p>${esc(r.result?.configuration||'domicile exchange')}</p><button class="proofBtn" data-proof="${esc(r.derivation_ref)}">Why?</button></article>`).join('')}</div></div><div><div class="panel"><h2>Graph findings</h2>${findings.slice(0,8).map(f=>`<div class="testimony"><b>${esc(f.title)}</b><p>${esc(f.statement)}</p><details><summary>Measurement</summary><div class="proof">${esc(pretty(f.measurement))}</div></details></div>`).join('')||'<span class="muted">No findings.</span>'}</div><div class="panel"><h2>Metrics</h2>${metrics.slice(0,10).map(m=>`<div class="fact"><span class="k">${esc(m.label)}</span><span><b>${esc(m.value)}</b> ${esc(m.unit||'')}</span></div>`).join('')}</div></div></div>`;
  document.getElementById('networkSvg').appendChild(qualifiedFlowSVG());wireProof(document.getElementById('networkContent'));
}

function riverSVG(){const svg=document.createElementNS(NS,'svg');svg.setAttribute('viewBox','0 0 1200 760');const yHouse=Object.fromEntries(river.houses.map((h,i)=>[h.house,42+i*58]));const ps=CLASSICAL_PLANETS,yPlanet=Object.fromEntries(ps.map((p,i)=>[p,95+i*88]));for(const b of river.source_bands){const y1=yHouse[b.house],y2=yPlanet[b.to];if(y2===undefined)continue;const l=svgLine(svg,{x:145,y:y1},{x:650,y:y2},'#546777',1.4,'',.55);l.style.cursor='pointer';l.onclick=()=>openProof(b.derivation_ref)}for(const b of river.planetary_bands){if(yPlanet[b.from]===undefined||yPlanet[b.to]===undefined)continue;const l=svgLine(svg,{x:650,y:yPlanet[b.from]},{x:1020,y:yPlanet[b.to]},'#d8be73',1+Math.min(10,b.count*1.25),'',.75);l.style.cursor='pointer';l.onclick=()=>openProof(b.derivation_ref)}for(const h of river.houses){const t=document.createElementNS(NS,'text');t.setAttribute('x','18');t.setAttribute('y',yHouse[h.house]+4);t.setAttribute('fill','#d7e0e7');t.setAttribute('font-size','10');t.textContent=`${h.house}H · ${h.topic}`;svg.appendChild(t)}for(const p of ps){const t=document.createElementNS(NS,'text');t.setAttribute('x','665');t.setAttribute('y',yPlanet[p]+4);t.setAttribute('fill','#fff');t.setAttribute('font-size','11');t.textContent=p;svg.appendChild(t)}return svg}
function renderRiver(){
  if(!river)return;document.getElementById('riverState').innerHTML='<b>House Flow synchronized.</b><br>Each lived house domain enters through its actual ruler. Planetary band width is only the integer number of house-ruler paths traversing that dispositor edge.';
  document.getElementById('riverContent').innerHTML=`<div class="summary"><div><b>12</b><span>lived domains</span></div><div><b>${river.planetary_bands.length}</b><span>shared routing edges</span></div><div><b>${river.max_route_count}</b><span>maximum route count</span></div><div><b>${river.derivation_entries.length}</b><span>river proof objects</span></div></div><div class="panel"><h2>House River</h2><div class="muted">House → entry ruler → shared dispositor routing. Thickness is route count, not soul power or strength.</div><div id="riverSvg"></div></div><div class="panel"><h2>All house routes</h2><table class="riverTable"><thead><tr><th>House</th><th>Domain</th><th>Sign</th><th>Entry ruler</th><th>Route</th></tr></thead><tbody>${river.houses.map(h=>`<tr><td>${h.house}H</td><td>${esc(h.topic)}</td><td>${esc(h.sign)}</td><td>${esc(h.entry_ruler)}</td><td>${esc((h.route||[]).join(' → '))}</td></tr>`).join('')}</tbody></table></div><div class="panel"><h2>Shared routing edges</h2>${river.planetary_bands.map(b=>`<div class="fact"><span class="k">${esc(b.from)} → ${esc(b.to)}</span><span><b>${b.count}</b> house routes · ${esc((b.houses||[]).map(h=>`${h}H`).join(', '))} <button data-proof="${esc(b.derivation_ref)}">Why?</button></span></div>`).join('')}</div>`;
  document.getElementById('riverSvg').appendChild(riverSVG());wireProof(document.getElementById('riverContent'));
}

function presenceTag(p){return p==='mixed'?'<span class="tag mix">mixed</span>':p==='bonification_present'?'<span class="tag bon">bonification</span>':p==='maltreatment_present'?'<span class="tag mal">maltreatment</span>':'<span class="tag">no selected compound testimony</span>'}
function testimonyHTML(t){const sect=(t.qualifiers?.sect||[]).map(x=>`${x.agent}: ${x.agent_sect_condition} → ${x.effect}`).join('; ')||'—',rec=(t.qualifiers?.reception||[]).filter(x=>x.present).map(x=>`${x.agent}: ${x.effect}`).join('; ')||'none';return `<div class="testimony"><span class="tag ${t.type==='bonification'?'bon':'mal'}">${esc(t.type)}</span><b>${esc((t.agents||[]).join(' + '))} → ${esc(t.target)}</b><div class="muted">${esc(t.mechanism)} · ${esc(t.rule_id)}</div><div class="fact"><span class="k">Sect</span><span>${esc(sect)}</span></div><div class="fact"><span class="k">Reception</span><span>${esc(rec)}</span></div><button class="proofBtn" data-proof="${esc(t.derivation_ref)}">Why?</button></div>`}
function compoundMiniMap(target){const svg=document.createElementNS(NS,'svg');svg.setAttribute('viewBox','0 0 760 420');svg.style.minHeight='420px';const ts=conditions.compound?.by_planet?.[target],items=[...(ts?.bonifications_received||[]),...(ts?.maltreatments_received||[])],cx=380,cy=210;const agents=[...new Set(items.flatMap(t=>t.agents||[]))];agents.forEach((a,i)=>{const ang=-Math.PI/2+i*2*Math.PI/Math.max(1,agents.length),p={x:cx+210*Math.cos(ang),y:cy+150*Math.sin(ang)};for(const t of items.filter(x=>(x.agents||[]).includes(a))){const l=svgLine(svg,p,{x:cx,y:cy},t.type==='bonification'?'#83c39b':'#d89292',3,t.mechanism?.includes('enclosure')?'7 5':'');l.style.cursor='pointer';l.onclick=()=>openProof(t.derivation_ref)}const text=document.createElementNS(NS,'text');text.setAttribute('x',p.x);text.setAttribute('y',p.y);text.setAttribute('text-anchor','middle');text.setAttribute('fill','#fff');text.setAttribute('font-size','11');text.textContent=a;svg.appendChild(text)});const c=document.createElementNS(NS,'circle');c.setAttribute('cx',cx);c.setAttribute('cy',cy);c.setAttribute('r','58');c.setAttribute('fill','#121a22');c.setAttribute('stroke','#d8be73');c.setAttribute('stroke-width','2.5');svg.appendChild(c);const t=document.createElementNS(NS,'text');t.setAttribute('x',cx);t.setAttribute('y',cy+4);t.setAttribute('text-anchor','middle');t.setAttribute('fill','#fff');t.setAttribute('font-size','13');t.textContent=target;svg.appendChild(t);return svg}
function renderCondition(){
  if(!conditions)return;const p=selectedPlanet,prim=conditions.primitive.by_planet[p],rel=conditions.relational.by_planet[p],comp=conditions.compound.by_planet[p];
  document.getElementById('conditionState').innerHTML='<b>Condition synchronized.</b><br>Primitive, relational, and compound testimonies remain separate categorical layers. No scalar planet-strength score is computed.';
  const essential=prim?.essential||{};
  document.getElementById('conditionContent').innerHTML=`<div class="planetBtns">${CLASSICAL_PLANETS.map(x=>`<button data-planet="${x}" class="${x===p?'active':''}">${x}</button>`).join('')}</div><div class="panel"><h2>${esc(p)} · condition signature</h2>${signature(p)}<div class="grid2"><div><h3>Primitive</h3><div class="fact"><span class="k">Sign / house</span><span>${esc(prim?.identity?.sign)} · ${prim?.identity?.computed_house}H</span></div><div class="fact"><span class="k">Essential</span><span>${[['domicile',essential.domicile],['adversity',essential.adversity],['exaltation',essential.exaltation],['fall/depression',essential.depression]].filter(([,v])=>v?.present).map(([k])=>k).join(', ')||'none of selected sign-level states'}</span></div><div class="fact"><span class="k">Sect</span><span>${esc(prim?.sect?.condition?.status)}</span></div><div class="fact"><span class="k">Angularity</span><span>${esc(prim?.positional?.angularity?.class)}</span></div><div class="fact"><span class="k">Bound ruler</span><span>${esc(essential.bound?.bound_ruler)}</span></div></div><div><h3>Relational</h3>${[...(rel?.receptions_given||[]),...(rel?.receptions_received||[]),...(rel?.exchanges||[]),...(rel?.mutual_receptions||[]),...(rel?.overcoming_given||[]),...(rel?.overcoming_received||[]),...(rel?.domination_given||[]),...(rel?.domination_received||[])].map(r=>`<div class="testimony"><b>${esc(relLabel(r))}</b><div class="muted">${esc(r.type)} · ${esc(r.rule_id)}</div><button data-proof="${esc(r.derivation_ref)}">Why?</button></div>`).join('')||'<span class="muted">No selected relation testimonies.</span>'}</div></div></div><div class="grid2"><div class="panel"><h2>Compound condition ${presenceTag(comp?.presence)}</h2><div class="call"><b>No net score exists.</b><br>Bonification and maltreatment can coexist. Sect and reception qualify testimonies without arithmetic collapse.</div>${(comp?.bonifications_received||[]).map(testimonyHTML).join('')}${(comp?.maltreatments_received||[]).map(testimonyHTML).join('')}${(comp?.enclosure_states||[]).map(e=>`<div class="testimony"><span class="tag ${e.enclosure_kind==='benefic'?'bon':'mal'}">${esc(e.enclosure_kind)} enclosure</span><b>${esc(e.status)}</b><div class="muted">${e.result?.interventions?.length?`${e.result.interventions.length} intervention(s)`:'no intervention'}</div><button data-proof="${esc(e.derivation_ref)}">Why?</button></div>`).join('')||''}</div><div class="panel"><h2>Compound map</h2><div id="compoundMini"></div><div class="muted">Green = bonification, red = maltreatment, dashed = enclosure. Line width is not strength.</div></div></div>`;
  document.querySelectorAll('[data-planet]').forEach(b=>b.onclick=()=>{selectedPlanet=b.dataset.planet;renderCondition()});document.getElementById('compoundMini').appendChild(compoundMiniMap(p));wireProof(document.getElementById('conditionContent'));
}

function renderWalkNode(n){if(!n)return '';const meta=n.status==='resolved'?`${n.kind} · ${n.source_collection}`:n.status;return `<div class="walkNode"><b>${esc(n.label||n.id)}</b><div class="muted">${esc(meta)}</div>${n.rule_id?`<div class="proof">rule: ${esc(n.rule_id)}</div>`:''}${n.source_reference?`<div class="proof">source: ${esc(n.source_reference)}</div>`:''}${n.inputs?`<details><summary>inputs/result</summary><div class="proof">${esc(pretty({inputs:n.inputs,result:n.result}))}</div></details>`:''}${n.children?.length?`<div class="walkChildren">${n.children.map(renderWalkNode).join('')}</div>`:''}</div>`}
function renderProof(){
  if(!index)return;const fallback=conditions.compound?.testimonies?.[0]?.derivation_ref||conditions.relational?.relations?.[0]?.derivation_ref||null,ref=selectedRef||fallback,tree=ref?walkDerivation(ref,index):null;
  document.getElementById('proofState').innerHTML=`<b>Proof index synchronized.</b><br>${index.count} indexed derivation objects. Older unnormalized dependencies are shown explicitly rather than invented.`;
  document.getElementById('proofContent').innerHTML=`<div class="summary"><div><b>${index.count}</b><span>indexed proof objects</span></div><div><b>${analysis?.derivation_ledger?.length||0}</b><span>deterministic ledger entries</span></div><div><b>${conditions?.relational?.relations?.length||0}</b><span>typed relations</span></div><div><b>${conditions?.compound?.testimonies?.length||0}</b><span>compound testimonies</span></div></div><div class="grid2"><div class="panel"><h2>Derivation Walker</h2>${tree?renderWalkNode(tree):'<span class="muted">No proof object selected.</span>'}</div><div class="panel"><h2>Integrity state</h2><div class="fact"><span class="k">Analysis schema</span><span>${esc(analysis?.schema_version||analysis?.model_id||'—')}</span></div><div class="fact"><span class="k">Condition system</span><span>${esc(conditions?.model_id)}</span></div><div class="fact"><span class="k">Graph model</span><span>${esc(graph?.model_id||'naf.research.graph_analytics.v0.4.1')}</span></div><div class="fact"><span class="k">House River</span><span>${esc(river?.model_id)}</span></div><div class="fact"><span class="k">Epistemic boundary</span><span>Astrological and energetic rules are explicit symbolic models; the interface does not imply measured physical force or validated causal efficacy.</span></div><details><summary>Current completeness</summary><div class="proof">${esc(pretty(conditions?.completeness))}</div></details></div></div>`;
}
function openProof(ref){if(!ref)return;selectedRef=ref;setView('proof');renderProof()}
function wireProof(root=document){root.querySelectorAll?.('[data-proof]').forEach(b=>b.onclick=()=>openProof(b.dataset.proof));root.querySelectorAll?.('[data-derivation]').forEach(b=>{if(b.dataset.derivation)b.onclick=()=>openProof(b.dataset.derivation)})}

function renderAll(){renderReading();renderResonance();renderNetwork();renderRiver();renderCondition();renderProof()}
</script>
