<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Noetic Atlas v0.4.1.2 — Energetic Analysis Observatory</title>
<style>
:root{--bg:#080c10;--panel:#10171e;--panel2:#0b1117;--line:#293541;--text:#edf2f5;--muted:#91a0ad;--gold:#d8be73;--green:#83c39b;--violet:#ac96d0;--cyan:#70b8ba;--red:#d89292}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:13px/1.58 system-ui,-apple-system,Segoe UI,sans-serif}#core{position:fixed;left:0;top:0;width:calc(100% - 640px);height:100%;border:0;background:#0a0e12}#dock{position:fixed;right:0;top:0;width:640px;height:100%;overflow:auto;background:var(--panel);border-left:1px solid var(--line);z-index:20}.dockHead{position:sticky;top:0;background:#10171efa;border-bottom:1px solid var(--line);padding:14px;z-index:5}.dockHead h1{font-size:17px;margin:0 0 2px}.eyebrow{font:9px/1.4 ui-monospace,monospace;color:var(--gold);letter-spacing:.08em}.model{font:9px/1.4 ui-monospace,monospace;color:#9caab5}.tabs,.filters,.nodes,.conditionButtons{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}.tabs button,.filters button,.chip,.nodeChip,.conditionButtons button{background:var(--panel2);color:#c5cfd7;border:1px solid var(--line);border-radius:6px;padding:6px 8px;cursor:pointer;font:inherit}.tabs button.active,.filters button.active,.conditionButtons button.active{background:var(--gold);color:#111;border-color:var(--gold)}.pane{display:none;padding:14px}.pane.active{display:block}.call{padding:11px;border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:8px;background:var(--panel2);font-size:10.5px;margin-bottom:11px}.summaryGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px}.summary{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px}.summary b{display:block;font-size:16px;color:var(--gold)}.summary span{font-size:9px;color:var(--muted)}.card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;margin:12px 0;overflow:hidden}.cardHead{padding:11px;border-bottom:1px solid #26313b}.cardHead h2{font-size:14px;margin:4px 0}.tag{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:1px 6px;font-size:8px;color:var(--muted);margin-right:4px}.tag.interpretive{border-color:var(--cyan);color:var(--cyan)}.tag.research{border-color:var(--violet);color:var(--violet)}.tag.energy{border-color:var(--gold);color:var(--gold)}.body{padding:11px}.section{border-top:1px solid #24303a;padding:9px 0}.section:first-child{border-top:0;padding-top:0}.section h3{font-size:9px;text-transform:uppercase;letter-spacing:.075em;color:var(--muted);margin:0 0 4px}.section p{font-size:10.5px;margin:0;color:#e2e9ed}.life{border-left:3px solid var(--gold);padding:9px;background:#111820;margin:9px 0;font-size:10.5px}.soul{border-left:3px solid var(--violet);padding:9px;background:#11131b;margin:9px 0;font-size:10.5px}.practice{margin:5px 0 0 18px;padding:0;font-size:10px}.practice li{margin:4px 0}.proof,.integrityBox,.measure{font:9px/1.45 ui-monospace,monospace;color:#b9c5cd;background:#080d12;border:1px solid #222c36;border-radius:6px;padding:7px;white-space:pre-wrap;word-break:break-word}.nodeChip{font-size:9px;padding:3px 6px}.metricValue{font-size:19px;color:var(--gold);font-weight:700}.fact{display:grid;grid-template-columns:140px 1fr;gap:8px;padding:6px 0;border-bottom:1px solid #222d37;font-size:10px}.k{color:var(--muted)}.present{color:var(--gold);font-weight:700}.in_sect{color:var(--green);font-weight:700}.out_of_sect{color:#e3a1a1;font-weight:700}.toggle{position:fixed;right:644px;top:8px;z-index:30;background:#111922;color:var(--gold);border:1px solid #485662;border-radius:7px;padding:7px 9px;cursor:pointer}.closed #dock{display:none}.closed #core{width:100%}.closed .toggle{right:8px}.empty{color:var(--muted);font-size:11px;margin-top:14px}.warn{color:#dfc988;font-size:9.5px}.technical{color:#b4c0c8;font-size:9.5px}
@media(max-width:1050px){#core{width:100%}#dock{width:min(98vw,640px);box-shadow:-8px 0 28px #000b}.toggle{right:min(calc(98vw + 4px),644px)}.closed .toggle{right:8px}.summaryGrid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<button class="toggle" id="toggle">Analysis ▸</button>
<iframe id="core" src="./index.html?build=v0412-energetic" title="Noetic Atlas core"></iframe>
<aside id="dock"><div class="dockHead"><h1>Noetic Atlas <span style="color:var(--gold)">v0.4.1.2</span></h1><div class="eyebrow">ENERGETIC WHOLE-CHART ANALYSIS + GRAPH INTEGRITY</div><div class="model">naf.interpretation.energetic_synthesis.v0.4.1.2 · naf.research.graph_analytics.v0.4.1</div><div class="tabs"><button class="active" data-pane="analysisPane">Energetic Analysis</button><button data-pane="findingsPane">Graph Findings</button><button data-pane="metricsPane">Metrics</button><button data-pane="conditionPane">Condition</button><button data-pane="integrityPane">Integrity</button></div></div><section id="analysisPane" class="pane active"></section><section id="findingsPane" class="pane"></section><section id="metricsPane" class="pane"></section><section id="conditionPane" class="pane"></section><section id="integrityPane" class="pane"></section></aside>
<script type="module">
import {computePrimitiveConditions,CLASSICAL_PLANETS} from '../src/conditions/primitive-condition-engine.mjs';
import {analyzeGraphArchitecture} from '../src/research/graph-analytics-engine.mjs';
import {buildEnergeticSynthesis} from '../src/interpretation/energetic-synthesis-engine.mjs';
const core=document.getElementById('core'),body=document.body,toggle=document.getElementById('toggle');let analysis=null,conditions=null,graph=null,energy=null,selectedProof=null,chosen='Sun',filter='featured',observer=null;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const pretty=x=>JSON.stringify(x,null,2);const cls=s=>['present','in_sect','out_of_sect'].includes(s)?s:'';
toggle.onclick=()=>{body.classList.toggle('closed');toggle.textContent=body.classList.contains('closed')?'Analysis ◂':'Analysis ▸'};document.querySelectorAll('[data-pane]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-pane]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('active',p.id===b.dataset.pane));if(b.dataset.pane==='integrityPane')renderIntegrity()});
function patchCoreBrand(){try{const d=core.contentDocument;if(!d)return;d.title='Noetic Atlas v0.4.1.2 — Energetic Analysis Observatory';const v=d.querySelector('.brand h1 small');if(v)v.textContent='v0.4.1.2 · ENERGETIC ANALYSIS';}catch{}}
function clickCoreNode(id){try{const d=core.contentDocument,field=d.querySelector('.tabs button[data-view="field"]');if(field)field.click();const groups=[...d.querySelectorAll('#fieldSvg g')],g=groups.find(el=>[...el.querySelectorAll('text')].some(t=>t.textContent.trim()===id));if(g)g.dispatchEvent(new MouseEvent('click',{bubbles:true,view:core.contentWindow}));}catch{}if(CLASSICAL_PLANETS.includes(id)){chosen=id;renderCondition()}}
function nodeChips(nodes=[]){return nodes.length?`<div class="nodes">${nodes.map(n=>`<button class="nodeChip" data-node="${esc(n)}">${esc(n)}</button>`).join('')}</div>`:''}
function wire(root=document){root.querySelectorAll('[data-node]').forEach(b=>b.onclick=()=>clickCoreNode(b.dataset.node));root.querySelectorAll('[data-energy-index]').forEach(b=>b.onclick=()=>{selectedProof=currentAnalysis()[Number(b.dataset.energyIndex)];document.querySelector('[data-pane="integrityPane"]').click()});root.querySelectorAll('[data-finding-index]').forEach(b=>b.onclick=()=>{selectedProof=graph.findings[Number(b.dataset.findingIndex)];document.querySelector('[data-pane="integrityPane"]').click()});root.querySelectorAll('[data-metric-index]').forEach(b=>b.onclick=()=>{selectedProof=graph.metrics[Number(b.dataset.metricIndex)];document.querySelector('[data-pane="integrityPane"]').click()})}
function currentAnalysis(){if(!energy)return[];if(filter==='graph')return energy.graph_cards;if(filter==='ceres')return energy.ceres;if(filter==='outer')return energy.outer_planets;if(filter==='placements')return energy.placements;if(filter==='aspects')return energy.aspects;return energy.featured}
function sync(){patchCoreBrand();try{const raw=core.contentDocument?.getElementById('json')?.textContent?.trim();if(!raw||!raw.startsWith('{'))return;analysis=JSON.parse(raw);conditions=computePrimitiveConditions(analysis);graph=analyzeGraphArchitecture(analysis,conditions);energy=buildEnergeticSynthesis(analysis,graph,conditions);renderAll()}catch(e){console.warn('v0.4.1.2 sync',e)}}
function sec(label,text,klass=''){return text?`<div class="section ${klass}"><h3>${esc(label)}</h3><p>${esc(text)}</p></div>`:''}
function renderEnergyCard(a,i){const s=a.sections||{};return `<article class="card"><div class="cardHead"><span class="tag interpretive">interpretive-inference</span><span class="tag energy">symbolic energy model</span><span class="tag">${esc(a.category)}</span><h2>${esc(a.title)}</h2>${nodeChips(a.objects||[])}</div><div class="body">${sec('Core energy',s.core_energy||s.plain_language)}${sec('How the energy moves',s.energetic_synthesis)}${sec('House ruler + routing',s.rulership_and_routing)}${sec('Aspect modulation',s.aspect_modulation)}${sec('Graph context',s.graph_context)}${sec('Balanced expression',s.balanced_expression)}${sec('Under-expression / depletion',s.under_expression)}${sec('Over-expression / excess',s.over_expression)}${s.material_expression?`<div class="life"><b>Material / lived expression</b><br>${esc(s.material_expression)}</div>`:''}${s.soul_question?`<div class="soul"><b>Soul / spirit inquiry</b><br>${esc(s.soul_question)}</div>`:''}${s.embodiment_practices?.length?`<div class="section"><h3>Ways to work with it</h3><ol class="practice">${s.embodiment_practices.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div>`:''}<details><summary>Evidence used</summary><div class="proof">${esc(pretty(a.evidence))}</div></details><button class="chip" data-energy-index="${i}">Why this analysis?</button></div></article>`}
function renderAnalysis(){const box=document.getElementById('analysisPane');if(!energy){box.innerHTML='<div class="empty">Calculate or load a chart. The energetic synthesis will appear after the deterministic chart and graph state exist.</div>';return}const list=currentAnalysis();box.innerHTML=`<div class="call"><b>Read the chart as a living system, not a list of placements.</b><br>The analysis separates: archetypal current → actual sign frequency → actual Whole Sign house field → house ruler/dispositor routing → aspect geometry → graph structure → balanced/excess/depleted expressions → material life → soul-level inquiry. “Energy” here is a symbolic interpretive language, not a claim of measured physical force.</div><div class="summaryGrid"><div class="summary"><b>${energy.placements.length}</b><span>placement energy profiles</span></div><div class="summary"><b>${energy.graph_cards.length}</b><span>graph structures translated</span></div><div class="summary"><b>${energy.aspects.length}</b><span>tight aspect currents</span></div></div><div class="filters">${[['featured','Featured synthesis'],['graph','Graph → meaning'],['ceres','Ceres'],['outer','Outer planets'],['placements','All placements'],['aspects','Tight aspects']].map(([k,l])=>`<button class="${filter===k?'active':''}" data-filter="${k}">${l}</button>`).join('')}</div>${filter==='ceres'&&!energy.ceres.length?`<div class="call"><b>Ceres is supported interpretively but is not in the current calculated state.</b><br>${esc(energy.applicability.ceres)} <span class="warn">Astronomy Engine's native body list covers Sun–Pluto; its small-body simulator can support asteroids, but Noetic Atlas will not silently invent a Ceres coordinate before a validated small-body adapter exists.</span></div>`:''}${list.map((a,i)=>renderEnergyCard(a,i)).join('')||'<div class="empty">No analyses in this category for the current chart.</div>'}`;box.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;renderAnalysis()});wire(box)}
function energeticGraphTranslation(f){const g=energy?.graph_cards||[];if(/basin|terminal/i.test(f.id||f.title||''))return g.find(x=>x.id==='energy.graph.terminal_basin');if(/bottleneck|upstream/i.test(f.id||f.title||''))return g.find(x=>x.id.startsWith('energy.graph.bottleneck.'));return null}
function renderFindings(){const box=document.getElementById('findingsPane');if(!graph){box.innerHTML='<div class="empty">No graph findings yet.</div>';return}box.innerHTML=`<div class="call"><b>The graph term is never the interpretation.</b><br>Technical findings remain available, but when an energetic translation exists it is shown first in ordinary language and tied to the houses/planets that create it.</div>${graph.findings.map((f,i)=>{const t=energeticGraphTranslation(f);return`<article class="card"><div class="cardHead"><span class="tag research">graph-derived / exploratory</span><h2>${esc(f.title)}</h2>${nodeChips(f.scope?.nodes||[])}</div><div class="body">${t?`<div class="life"><b>What this means in the chart</b><br>${esc(t.sections.plain_language)}<br><br>${esc(t.sections.energetic_synthesis)}<br><br>${esc(t.sections.material_expression)}</div>`:''}<details><summary>Technical graph statement</summary><div class="section"><p>${esc(f.statement)}</p></div><div class="measure">${esc(pretty(f.measurement))}</div><div class="technical">${esc(f.readable_analysis.graph_theory_meaning)}</div></details><button class="chip" data-finding-index="${i}">Open proof</button></div></article>`}).join('')}`;wire(box)}
function renderMetrics(){const box=document.getElementById('metricsPane');if(!graph){box.innerHTML='<div class="empty">No metrics yet.</div>';return}box.innerHTML=`<div class="call"><b>Metrics are diagnostic evidence.</b><br>The main reading lives in Energetic Analysis. This pane keeps the mathematical quantities available for audit without asking a non-specialist to interpret a number as destiny.</div>${graph.metrics.map((m,i)=>`<article class="card"><div class="cardHead"><span class="tag research">research-exploratory</span><h2>${esc(m.label)}</h2><span class="metricValue">${esc(m.value)}</span> <span class="k">${esc(m.unit||'')}</span></div><div class="body">${sec('What was measured',m.definition)}<div class="measure">${esc(m.formula)}</div>${sec('Observed in this chart',m.readable_analysis.observation)}<details><summary>Graph-theory meaning + proof</summary><div class="technical">${esc(m.readable_analysis.graph_theory_meaning)}</div><div class="proof">${esc(pretty(m.integrity))}</div></details><button class="chip" data-metric-index="${i}">Open integrity</button></div></article>`).join('')}`;wire(box)}
function statusLine(f,label){if(!f)return`<div class="fact"><span class="k">${esc(label)}</span><span>—</span></div>`;const s=f.status||'—';return`<div class="fact"><span class="k">${esc(label)}</span><span class="${cls(s)}">${esc(s)}${f.present===true?' · yes':f.present===false?' · no':''}</span></div>`}
function renderCondition(){const box=document.getElementById('conditionPane');if(!conditions){box.innerHTML='<div class="empty">No classical condition state yet.</div>';return}const rec=conditions.by_planet[chosen]||conditions.by_planet.Sun,e=rec.essential,s=rec.sect,p=rec.positional.angularity;box.innerHTML=`<div class="call"><b>Traditional condition is one layer of the energetic reading.</b><br>Condition describes the rule-defined state of the classical planet. It does not replace sign, house, ruler routing, aspects, or the energetic synthesis.</div><div class="conditionButtons">${CLASSICAL_PLANETS.map(x=>`<button data-cp="${x}" class="${x===rec.planet?'active':''}">${x}</button>`).join('')}</div><h2>${esc(rec.planet)} · ${esc(rec.identity.sign)} ${rec.identity.degree_in_sign.toFixed(2)}° · ${rec.identity.computed_house}H</h2>${statusLine(e.domicile,'Domicile')}${statusLine(e.adversity,'Adversity')}${statusLine(e.exaltation,'Exaltation')}${statusLine(e.depression,'Depression / fall')}<div class="fact"><span class="k">Triplicity</span><span>${esc(e.triplicity.planet_roles.join(', ')||'none')}${e.triplicity.active_for_chart?' · active sect ruler':''}</span></div><div class="fact"><span class="k">Egyptian bound</span><span>${esc(e.bound.bound_ruler)} [${e.bound.start_deg},${e.bound.end_deg})</span></div><div class="fact"><span class="k">Sect condition</span><span class="${cls(s.condition.status)}">${esc(s.condition.status)}</span></div><div class="fact"><span class="k">Angularity</span><span>${esc(p.class)} · ${p.house}H</span></div><details><summary>Primitive condition ledger</summary><div class="proof">${esc(pretty(rec.ledger_entries))}</div></details>`;box.querySelectorAll('[data-cp]').forEach(b=>b.onclick=()=>{chosen=b.dataset.cp;renderCondition();clickCoreNode(chosen)})}
function renderIntegrity(){const box=document.getElementById('integrityPane');if(!analysis){box.innerHTML='<div class="empty">No state yet.</div>';return}box.innerHTML=`<div class="call"><b>Integrity stack</b><br>Coordinate → sign/Whole Sign house → astrological rule → graph derivation → energetic interpretation. Natural-house correspondence is explicitly labeled modern/secondary; Ceres uses the custom sample-derived interpretive profile; energy language remains symbolic.</div><h3>Selected evidence object</h3><div class="integrityBox">${esc(pretty(selectedProof||energy?.integrity||graph?.integrity||{}))}</div><details><summary>Full energetic state</summary><div class="proof">${esc(pretty(energy))}</div></details><details><summary>Full graph state</summary><div class="proof">${esc(pretty(graph))}</div></details>`}
function renderAll(){renderAnalysis();renderFindings();renderMetrics();renderCondition();renderIntegrity()}
core.addEventListener('load',()=>{patchCoreBrand();try{const d=core.contentDocument,j=d.getElementById('json'),ins=d.getElementById('inspector'),status=d.getElementById('status');observer?.disconnect();observer=new MutationObserver(sync);if(j)observer.observe(j,{childList:true,characterData:true,subtree:true});if(ins)observer.observe(ins,{childList:true,characterData:true,subtree:true});if(status)observer.observe(status,{childList:true,characterData:true,subtree:true});sync()}catch(e){console.warn(e)}});
</script>
</body></html>
